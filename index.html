<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS — your school desk</title>
<meta name="theme-color" content="#E9ECF2" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A single-file school organizer: notebooks, calendar, assignments, flashcards and focus tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ATLAS — design tokens
   Direction: a physical class binder. Cool paper, ink, colored
   divider tabs. Every object that belongs to a class carries
   that class's spine. Ultramarine for structure, marigold for
   time pressure, mono for anything measured.
   ============================================================ */
/* Every shade below the seven theme colours is mixed from them, so adding a
   theme means adding seven values — not a second stylesheet. */
:root{
  --ink:#141821; --bg:#E9ECF2; --panel:#FFFFFF;
  --ultra:#2739CF; --marigold:#D9910F; --crimson:#CE3B47; --moss:#0C8F6A;
  --fs:14.5px; --pad:1;
  --ink2:color-mix(in srgb, var(--ink) 74%, var(--bg));
  --ink3:color-mix(in srgb, var(--ink) 50%, var(--bg));
  --panel2:color-mix(in srgb, var(--panel) 95%, var(--ink));
  --panel3:color-mix(in srgb, var(--panel) 89%, var(--ink));
  --rule:color-mix(in srgb, var(--panel) 88%, var(--ink));
  --rule2:color-mix(in srgb, var(--panel) 78%, var(--ink));
  --ultra2:color-mix(in srgb, var(--ultra) 82%, #fff);
  --ultraSoft:color-mix(in srgb, var(--ultra) 13%, var(--panel));
  --marigoldSoft:color-mix(in srgb, var(--marigold) 15%, var(--panel));
  --crimsonSoft:color-mix(in srgb, var(--crimson) 14%, var(--panel));
  --mossSoft:color-mix(in srgb, var(--moss) 14%, var(--panel));
  --shadow:0 1px 2px rgba(20,24,33,.06), 0 6px 18px -8px rgba(20,24,33,.18);
  --shadowUp:0 2px 4px rgba(20,24,33,.07), 0 18px 40px -14px rgba(20,24,33,.28);
  --r:14px; --r2:10px; --r3:7px;
  --display:'Bricolage Grotesque','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sidebar:252px; --vp:20px;
}
[data-mode="dark"]{
  --ink2:color-mix(in srgb, var(--ink) 68%, var(--bg));
  --ink3:color-mix(in srgb, var(--ink) 44%, var(--bg));
  --panel2:color-mix(in srgb, var(--panel) 92%, var(--ink));
  --panel3:color-mix(in srgb, var(--panel) 84%, var(--ink));
  --rule:color-mix(in srgb, var(--panel) 84%, var(--ink));
  --rule2:color-mix(in srgb, var(--panel) 70%, var(--ink));
  --ultraSoft:color-mix(in srgb, var(--ultra) 22%, var(--panel));
  --marigoldSoft:color-mix(in srgb, var(--marigold) 20%, var(--panel));
  --crimsonSoft:color-mix(in srgb, var(--crimson) 20%, var(--panel));
  --mossSoft:color-mix(in srgb, var(--moss) 20%, var(--panel));
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
  --shadowUp:0 2px 6px rgba(0,0,0,.45), 0 22px 50px -18px rgba(0,0,0,.8);
}
/* Safety net for anything too old for color-mix: the default light palette. */
@supports not (color: color-mix(in srgb, red, blue)){
  :root{--ink2:#4B5468;--ink3:#828C9F;--panel2:#F4F6FA;--panel3:#EDF0F6;--rule:#D9DEE8;--rule2:#C6CDDB;
    --ultra2:#4B5AE8;--ultraSoft:#E7E9FD;--marigoldSoft:#FCF0D8;--crimsonSoft:#FBE4E6;--mossSoft:#DEF3EC}
}
*{box-sizing:border-box}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
html,body{height:100%}
body{
  margin:0; background-color:var(--bg); background-image:var(--tex,none); background-size:var(--texsize,auto); background-attachment:fixed;
  color:var(--ink); font-family:var(--body);
  font-size:var(--fs); line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:700; margin:0; letter-spacing:-.02em; line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--ultra)}
:focus-visible{outline:2.5px solid var(--ultra2); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- shell ---------- */
#app{display:grid; grid-template-columns:var(--sidebar) 1fr; height:100dvh; overflow:hidden}
#side{
  background:var(--panel); border-right:1px solid var(--rule); display:flex; flex-direction:column;
  min-height:0; z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{
  width:30px;height:30px;border-radius:9px;background:var(--ultra);color:#fff;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:16px;flex:none;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.03em}
.brand small{display:block;font-size:11.5px;color:var(--ink3);margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.navwrap{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 14px}
.navsec{margin-top:14px}
.navsec .eyebrow{padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center}
.navsec .eyebrow button{color:var(--ink3);font-size:15px;line-height:1;padding:2px 5px;border-radius:6px}
.navsec .eyebrow button:hover{background:var(--panel3);color:var(--ultra)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r2);color:var(--ink2);font-weight:500;text-align:left;transition:background .12s,color .12s,transform .12s}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.9}
.nav:hover{background:var(--panel3);color:var(--ink)}
.nav.on{background:var(--ultraSoft);color:var(--ultra);font-weight:600}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--panel3);color:var(--ink3);padding:1px 6px;border-radius:20px}
.nav.on .cnt{background:var(--ultra);color:#fff}
/* signature: divider tabs */
.tab{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px 7px 12px;text-align:left;
  border-radius:0 var(--r2) var(--r2) 0; margin-left:-10px; color:var(--ink2); font-weight:500;
  border-left:4px solid var(--tc,var(--rule2)); transition:transform .14s cubic-bezier(.2,.8,.3,1),background .12s,color .12s;
}
.tab:hover{background:var(--panel3);transform:translateX(4px);color:var(--ink)}
.tab.on{background:var(--panel2);color:var(--ink);font-weight:600;transform:translateX(4px)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tcode{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.sidefoot{border-top:1px solid var(--rule);padding:8px 10px;display:flex;gap:6px;align-items:center}
.acct{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:5px 7px;border-radius:var(--r2);transition:background .12s;text-align:left}
.acct:hover{background:var(--panel3)}
.ava{width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--ultra);color:#fff;font-family:var(--display);font-weight:800;font-size:12.5px}
.an{min-width:0;line-height:1.25}
.an b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncstate{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncstate::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--moss);margin-right:5px;vertical-align:middle}
.syncstate.saving::before,.syncstate.unsaved::before,.syncstate.syncing::before{background:var(--marigold);animation:pulse 1s infinite}
.syncstate.retrying::before,.syncstate.offline::before,.syncstate.locked::before{background:var(--crimson)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dev{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r2);background:var(--panel2);margin-bottom:6px}
.dev b{font-size:13px;font-weight:600}
.dev .now{font-family:var(--mono);font-size:9.5px;color:var(--moss);text-transform:uppercase;letter-spacing:.1em}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{
  display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);
  background:color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter:blur(10px); z-index:20;
}
#top h1{font-size:21px}
#top .sub{font-size:12px;color:var(--ink3)}
.spacer{flex:1}
#view{flex:1;min-height:0;overflow-y:auto;padding:var(--vp);scroll-behavior:smooth}
.wrap{max-width:1120px;margin:0 auto}
.wide{max-width:1400px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r2);
  border:1px solid var(--rule2); background:var(--panel); color:var(--ink); font-weight:500; font-size:13.5px;
  transition:background .12s,border-color .12s,transform .08s,box-shadow .12s; white-space:nowrap;
}
.btn:hover{background:var(--panel2);border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn.p{background:var(--ultra);border-color:var(--ultra);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.p:hover{background:var(--ultra2);border-color:var(--ultra2)}
.btn.g{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.g:hover{background:var(--panel3);color:var(--ink)}
.btn.dg{color:var(--crimson);border-color:transparent}
.btn.dg:hover{background:var(--crimsonSoft);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.sm svg{width:13px;height:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card.spine{border-left:4px solid var(--tc,var(--ultra))}
.pad{padding:calc(16px * var(--pad))}
.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;
  font-variant-numeric:tabular-nums;font-weight:600;background:var(--panel3);color:var(--ink2);white-space:nowrap;
}
.chip.b{background:var(--ultraSoft);color:var(--ultra)}
.chip.w{background:var(--marigoldSoft);color:var(--marigold)}
.chip.r{background:var(--crimsonSoft);color:var(--crimson)}
.chip.g{background:var(--mossSoft);color:var(--moss)}
.dot{width:9px;height:9px;border-radius:3px;background:var(--tc,var(--ultra));flex:none}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{
  width:100%;padding:8px 11px;border:1px solid var(--rule2);border-radius:var(--r2);background:var(--panel);
  transition:border-color .12s, box-shadow .12s; font-size:14px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ultra);box-shadow:0 0 0 3px var(--ultraSoft)}
textarea{resize:vertical;line-height:1.6}
label.f,div.f{display:block;margin-bottom:12px}
label.f > span,div.f > span{display:block;margin-bottom:5px;font-family:var(--body);font-size:12.5px;color:var(--ink2);font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ultra);cursor:pointer}
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty h3{font-size:17px;color:var(--ink2);margin-bottom:5px}
.empty p{margin:0 0 14px;font-size:13.5px;max-width:340px;margin-inline:auto}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--panel3);border-radius:9px;padding:2.5px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.bar{height:6px;background:var(--panel3);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ultra);border-radius:20px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
hr.rule{border:none;border-top:1px solid var(--rule);margin:16px 0}

/* ---------- today ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:31px;letter-spacing:-.035em}
.hello .date{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase}
.ribbon{position:relative;height:74px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.ribbon .hr{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule);font-family:var(--mono);font-size:9px;color:var(--ink3);padding:3px 0 0 4px}
.rb{position:absolute;top:20px;height:46px;border-radius:7px;padding:5px 8px;overflow:hidden;font-size:11.5px;font-weight:600;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);animation:grow .5s cubic-bezier(.2,.8,.3,1) both}
.rb small{display:block;font-family:var(--mono);font-size:9px;opacity:.85;font-weight:400}
@keyframes grow{from{transform:scaleX(.2);opacity:0;transform-origin:left}to{transform:scaleX(1);opacity:1;transform-origin:left}}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--crimson);z-index:5}
.nowline::before{content:'';position:absolute;top:-1px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--crimson)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:27px;letter-spacing:-.04em;line-height:1.1}
.stat span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3)}
.cols2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-bottom:1px solid var(--rule);transition:background .12s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--panel2)}
.item .ttl{font-weight:600;font-size:14px}
.item .meta{font-size:12px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item.done .ttl{text-decoration:line-through;color:var(--ink3);text-decoration-thickness:1.5px}
.cardhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--panel2)}
.cardhead h3{font-size:14.5px}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--rule);border-top:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.cdh{padding:7px 9px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--panel2);font-weight:600}
.cd{min-width:0;min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 6px;cursor:pointer;transition:background .12s;position:relative}
.cd:hover{background:var(--panel2)}
.cd.out{background:var(--panel2);color:var(--ink3)}
.cd.today .dnum{background:var(--ultra);color:#fff}
.dnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;margin-bottom:3px}
.ev{display:block;width:100%;text-align:left;font-size:11px;padding:2px 5px;border-radius:5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--tc,var(--ultra));background:var(--panel3);font-weight:500}
.ev.task{background:var(--marigoldSoft);color:var(--marigold)}
.ev.late{background:var(--crimsonSoft);color:var(--crimson)}
.week{display:grid;grid-template-columns:52px repeat(7,1fr);background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.wcol{border-left:1px solid var(--rule);position:relative;min-height:600px}
.wh{position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);padding:6px 8px;z-index:3;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.wh b{font-family:var(--display);font-size:15px;color:var(--ink);display:block;letter-spacing:-.02em}
.wh.now b{color:var(--ultra)}
.gut{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:right;padding-right:6px}
.slot{border-bottom:1px solid var(--panel3);cursor:pointer}
.slot:hover{background:var(--ultraSoft)}
.wev{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:600;color:#fff;overflow:hidden;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);z-index:2}
.wev small{display:block;font-family:var(--mono);font-size:9px;opacity:.85;font-weight:400}

/* ---------- notebook ---------- */
.nbwrap{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;height:100%}
.nblist{max-height:calc(100dvh - 150px);overflow-y:auto}
.nbitem{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);border-left:3px solid transparent;transition:background .12s}
.nbitem:hover{background:var(--panel2)}
.nbitem.on{background:var(--ultraSoft);border-left-color:var(--ultra)}
.nbitem b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbitem span{font-size:11px;color:var(--ink3);font-family:var(--mono)}
#noteTitle{font-family:var(--display);font-size:24px;font-weight:700;border:none;padding:0;background:none;letter-spacing:-.03em}
#noteTitle:focus{box-shadow:none}
#noteBody{
  border:none;padding:0;background:
    linear-gradient(to bottom, transparent 0, transparent calc(1.75em - 1px), var(--panel3) calc(1.75em - 1px), var(--panel3) 1.75em);
  background-size:100% 1.75em; line-height:1.75em; min-height:52vh; font-size:15px;
}
#noteBody:focus{box-shadow:none}
.nbtools{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--rule);background:var(--panel2)}

/* ---------- flashcards ---------- */
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.deck{padding:15px;cursor:pointer;transition:transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .14s;position:relative}
.deck:hover{transform:translateY(-3px);box-shadow:var(--shadowUp)}
.deck h3{font-size:16px;margin-bottom:3px}
.flipwrap{perspective:1400px;max-width:620px;margin:0 auto}
.flip{position:relative;min-height:300px;transition:transform .5s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:30px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadowUp)}
.face.back{transform:rotateY(180deg);background:var(--panel2)}
.face p{font-size:20px;font-weight:500;line-height:1.45;margin:0;max-width:100%;overflow-wrap:anywhere}
.face .eyebrow{position:absolute;top:14px;left:16px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:620px;margin:16px auto 0}
.grade button{padding:10px 4px;border-radius:var(--r2);border:1px solid var(--rule2);background:var(--panel);font-weight:600;font-size:13px;transition:transform .08s,background .12s}
.grade button:hover{transform:translateY(-2px)}
.grade button small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.grade button.q0:hover{background:var(--crimsonSoft);border-color:var(--crimson)}
.grade button.q1:hover{background:var(--marigoldSoft);border-color:var(--marigold)}
.grade button.q3:hover{background:var(--ultraSoft);border-color:var(--ultra)}
.grade button.q5:hover{background:var(--mossSoft);border-color:var(--moss)}

/* ---------- rendered text: AI results, page previews ---------- */
.bub{background:var(--panel);border:1px solid var(--rule);border-radius:4px var(--r) var(--r) var(--r);padding:11px 14px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.bub p{margin:0 0 9px}.bub p:last-child{margin-bottom:0}
.bub code{font-family:var(--mono);font-size:12.5px;background:var(--panel3);padding:1px 5px;border-radius:5px}
.bub pre{background:var(--panel3);padding:11px;border-radius:var(--r2);overflow-x:auto;margin:9px 0}
.bub pre code{background:none;padding:0;font-size:12px;line-height:1.55}
.bub ul,.bub ol{margin:6px 0;padding-left:20px}
.bub li{margin:3px 0}
.bub h4{font-size:14px;margin:12px 0 5px}
.bub table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.bub th,.bub td{border:1px solid var(--rule);padding:5px 8px;text-align:left}
.bub th{background:var(--panel2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- modal / palette / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,15,22,.42);backdrop-filter:blur(3px);z-index:100;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:18px;animation:fade .16s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadowUp);width:min(540px,100%);max-height:88dvh;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1) both;border:1px solid var(--rule)}
.modal.lg{width:min(780px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.mhead h3{font-size:17px}
.mbody{padding:18px;overflow-y:auto}
.mfoot{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--rule);background:var(--panel2);border-radius:0 0 16px 16px}
.palette{align-items:flex-start;padding-top:12vh}
.pal{width:min(560px,100%);background:var(--panel);border-radius:16px;box-shadow:var(--shadowUp);overflow:hidden;border:1px solid var(--rule)}
.pal input{border:none;border-radius:0;border-bottom:1px solid var(--rule);padding:15px 18px;font-size:16px}
.pal input:focus{box-shadow:none}
.palres{max-height:52vh;overflow-y:auto;padding:6px}
.pr{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);cursor:pointer;width:100%;text-align:left}
.pr.on{background:var(--ultraSoft)}
.pr .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r2);box-shadow:var(--shadowUp);font-size:13.5px;font-weight:500;animation:slide .22s cubic-bezier(.2,.9,.3,1) both;max-width:340px}
.toast.err{background:var(--crimson);color:#fff}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ---------- focus timer ---------- */
.focusbar{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--rule2);font-family:var(--mono);font-size:13px;font-weight:600}
.focusbar.run{border-color:var(--ultra);color:var(--ultra);background:var(--ultraSoft)}
.focusbar.brk{color:var(--moss)}
.focusbar.brk.run{border-color:var(--moss);background:var(--mossSoft)}
.focusbar .btn svg,#searchBtn svg{width:13px;height:13px}
.zen{position:fixed;inset:0;background:var(--bg);z-index:150;display:grid;place-items:center;text-align:center}
.zen .big{font-family:var(--mono);font-size:clamp(64px,17vw,150px);font-weight:600;letter-spacing:-.04em;line-height:1}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}

/* ---------- grades ---------- */
table.gt{width:100%;border-collapse:collapse;font-size:13.5px}
table.gt th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--rule);font-weight:600}
table.gt td{padding:7px 10px;border-bottom:1px solid var(--rule)}
table.gt tr:last-child td{border-bottom:none}
table.gt input{padding:4px 7px;border-radius:7px;font-size:13px}
.gpa{font-family:var(--display);font-size:44px;letter-spacing:-.045em;line-height:1}

/* ---------- theme art, gallery, streaks, badges ---------- */
.artband{position:relative;height:120px;margin:calc(var(--vp) * -1) calc(var(--vp) * -1) 16px;overflow:hidden;border-bottom:1px solid var(--rule);
  background:linear-gradient(to bottom, color-mix(in srgb, var(--ultra) 9%, var(--bg)), var(--bg))}
.artband svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.artband.wide svg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.tsw{border:2px solid var(--rule);border-radius:var(--r2);overflow:hidden;text-align:left;transition:transform .14s cubic-bezier(.2,.8,.3,1),border-color .14s,box-shadow .14s}
.tsw:hover{transform:translateY(-3px)}
.tsw.on{border-color:var(--ultra);box-shadow:0 0 0 3px var(--ultraSoft)}
.tsw-p{display:block;padding:9px;background:var(--sw-bg)}
.tsw-p i{display:block;height:6px;border-radius:3px;margin-bottom:5px;background:var(--sw-ink);opacity:.7}
.tsw-p i:nth-child(2){width:68%;background:var(--sw-ac);opacity:1}
.tsw-p i:nth-child(3){width:44%;margin-bottom:0}
.tsw-n{display:block;padding:6px 9px 8px;font-size:12px;font-weight:600;background:var(--sw-panel);color:var(--sw-ink)}
.acsw{width:30px;height:30px;border-radius:9px;border:2px solid var(--rule2);font-size:9px;font-family:var(--mono);color:var(--ink3);transition:transform .12s}
.acsw.on{border-color:var(--ink);transform:scale(1.08)}
.heat{overflow-x:auto;padding-bottom:2px}
.heatm{display:grid;grid-template-columns:repeat(27,1fr);gap:3px;font-family:var(--mono);font-size:9px;color:var(--ink3);margin-bottom:4px;min-width:430px}
.heatg{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;min-width:430px}
.heatg i{display:block;aspect-ratio:1;border-radius:3px;background:var(--panel3);cursor:pointer;transition:transform .1s}
.heatg i:hover{transform:scale(1.35)}
.heatkey{display:inline-grid;grid-auto-flow:column;gap:3px;margin:0 6px;vertical-align:middle}
.heatkey i{display:block;width:10px;height:10px;border-radius:3px;background:var(--panel3)}
.heatg i.l1,.heatkey i.l1{background:color-mix(in srgb,var(--ultra) 28%,var(--panel))}
.heatg i.l2,.heatkey i.l2{background:color-mix(in srgb,var(--ultra) 50%,var(--panel))}
.heatg i.l3,.heatkey i.l3{background:color-mix(in srgb,var(--ultra) 74%,var(--panel))}
.heatg i.l4,.heatkey i.l4{background:var(--ultra)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.badge{padding:12px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--panel2);opacity:.42;transition:opacity .2s}
.badge.on{opacity:1;background:var(--panel);border-color:var(--ultra);box-shadow:var(--shadow)}
.badge .bi{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--panel3);font-size:16px;margin-bottom:7px}
.badge.on .bi{background:var(--ultra);color:var(--panel)}
.badge b{display:block;font-size:13px;margin-bottom:1px}
.badge span{font-size:11.5px;color:var(--ink3);line-height:1.35}
.bstrip{display:flex;gap:6px;flex-wrap:wrap}
.bstrip i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ultra);color:var(--panel);font-size:13px;font-style:normal}
.cdn{width:48px;flex:none;text-align:center;border-radius:var(--r2);padding:5px 0;color:var(--tc,var(--ultra));
  background:color-mix(in srgb, var(--tc,var(--ultra)) 14%, var(--panel))}
.cdn b{display:block;font-family:var(--display);font-size:19px;line-height:1.05}
.cdn span{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.1em}
.kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel3);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;min-width:88px;text-align:center;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:8px;height:13px;border-radius:2px;animation:fall linear both}
@keyframes fall{to{transform:translateY(106vh) rotate(640deg);opacity:.08}}

/* ---------- swatch mock, account sheet, break room ---------- */
.tsw-p{display:flex;height:56px;background:var(--sw-bg);padding:0;gap:0}
.tsw-side{width:26%;background:var(--sw-panel);padding:7px 5px;display:block;border-right:1px solid color-mix(in srgb,var(--sw-ink) 14%,transparent)}
.tsw-side i{display:block;height:4px;border-radius:2px;margin-bottom:4px;background:var(--sw-ink);opacity:.35}
.tsw-side i.a{background:var(--sw-ac);opacity:1;width:80%}
.tsw-main{flex:1;padding:7px 6px;display:block}
.tsw-card{display:block;background:var(--sw-panel);border-radius:4px;padding:5px;margin-bottom:4px;border-left:3px solid var(--sw-ac)}
.tsw-card.sm{padding:4px;opacity:.7;border-left-color:var(--sw-ink)}
.tsw-card i{display:block;height:3px;border-radius:2px;background:var(--sw-ink);opacity:.4;margin-bottom:3px}
.tsw-card i:last-child{margin-bottom:0}
.tsw-card i.a{background:var(--sw-ac);opacity:1;width:55%}
.tsw-n{display:block;padding:7px 9px 9px;font-size:12px;font-weight:600;background:var(--sw-panel);color:var(--sw-ink);line-height:1.25}
.tsw-n em{display:block;font-style:normal;font-weight:400;font-size:10.5px;opacity:.62;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.savebox{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--rule);background:var(--panel2);margin-bottom:10px}
.savebox b{display:block;font-size:14px}
.savebox span{display:block;font-size:12px;color:var(--ink3)}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--marigold);animation:pulse 1s infinite}
.savebox.ok .sdot{background:var(--moss);animation:none}
.arow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r2);background:var(--panel2);margin-bottom:7px}
.arow b{display:block;font-size:13.5px}
.arow span{display:block;font-size:11.5px;color:var(--ink3)}
details.adv{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
details.adv summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600;padding:5px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
details.adv[open] summary::before{content:'▾ '}
details.adv .advb{padding-top:10px}
.tgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--panel3);padding:8px;border-radius:var(--r2);aspect-ratio:1;max-width:400px;margin:0 auto}
.tl{border-radius:var(--r3);background:color-mix(in srgb,var(--ink) 6%,var(--panel));display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:clamp(15px,5.2vw,26px);letter-spacing:-.03em;transition:background .12s}
.tl.on{animation:pop .16s cubic-bezier(.2,.9,.3,1)}
.tl.m{font-size:clamp(13px,4.4vw,22px)}
.tl.s{font-size:clamp(11px,3.6vw,18px)}
.tpad{display:grid;justify-items:center;gap:6px;margin-top:14px}
.tpad .btn{width:52px;justify-content:center;font-size:17px;padding:7px 0}
.tpad>div{display:flex;gap:6px}
.gover{text-align:center;padding:14px;margin-top:12px;border-radius:var(--r2);background:var(--ultraSoft)}
.gover b{display:block;font-family:var(--display);font-size:19px}
.gover span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:1.25;border-radius:var(--r2);border:1px solid var(--rule2);background:var(--panel2);display:grid;place-items:center;
  padding:7px;font-size:11.5px;line-height:1.25;text-align:center;overflow:hidden;transition:background .15s,border-color .15s,transform .15s}
.mc span{max-height:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.mc.up{background:var(--ultraSoft);border-color:var(--ultra)}
.mc.done{background:var(--mossSoft);border-color:transparent;opacity:.55}
.mc:not(.up):not(.done):hover{transform:translateY(-2px);border-color:var(--ink3)}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(4,1fr)}}


/* ---------- personal layout: today blocks, nudge ---------- */
.card.hero{margin-bottom:14px}
.cols2.one{grid-template-columns:1fr}
.stack > * + *{margin-top:14px}
.stack > *:first-child{margin-top:0 !important}
.stats.n1{grid-template-columns:1fr}.stats.n2{grid-template-columns:repeat(2,1fr)}.stats.n3{grid-template-columns:repeat(3,1fr)}
.nudge{border-color:color-mix(in srgb,var(--ultra) 45%,var(--rule));background:linear-gradient(115deg,var(--ultraSoft),var(--panel) 72%)}
.nudge-ic{width:40px;height:40px;border-radius:12px;background:var(--ultra);color:#fff;display:grid;place-items:center;flex:none}
.nudge-ic svg{width:20px;height:20px}
.fh{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.fh-time{font-family:var(--mono);font-size:clamp(46px,7vw,70px);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ultra)}
.fh-body{flex:1;min-width:220px}
.fh-body h3{font-size:20px;margin:2px 0 4px}
.fh-body p{margin:0 0 12px;font-size:13px}
.ntiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ntile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--rule);border-left:4px solid var(--tc);transition:transform .14s,box-shadow .14s;min-width:0}
.ntile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ntile b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntile .snip{font-size:12px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rv-big{display:flex;align-items:baseline;gap:10px;flex:1;min-width:200px}
.rv-big b{font-family:var(--display);font-size:44px;letter-spacing:-.04em;line-height:1;color:var(--ultra)}
.rv-big span{color:var(--ink2);font-size:14px}
.bigfig{font-family:var(--display);font-size:26px;letter-spacing:-.03em}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 14px}
.modchk svg{width:15px;height:15px;color:var(--ink3);flex:none}

/* ---------- setup survey ---------- */
.sv{position:fixed;inset:0;z-index:160;background-color:var(--bg);background-image:var(--tex,none);background-size:var(--texsize,auto);display:flex;flex-direction:column;color:var(--ink);animation:fade .2s both}
.sv-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(10px)}
.sv-top .sv-brand{font-family:var(--display);font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.sv-prog{flex:1;max-width:380px;height:6px;border-radius:9px;background:var(--panel3);overflow:hidden;margin-left:8px}
.sv-prog i{display:block;height:100%;width:0;background:var(--ultra);border-radius:9px;transition:width .4s cubic-bezier(.2,.8,.3,1)}
.sv-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px)}
.sv-q{overflow-y:auto;padding:40px 48px 36px;scroll-behavior:smooth;display:flex;flex-direction:column}
.sv-qi{max-width:640px;width:100%;margin:auto}
.sv-qi.anim{animation:svIn .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes svIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sv-q h2{font-size:clamp(27px,3.3vw,40px);letter-spacing:-.04em;margin:8px 0 10px;line-height:1.08}
.sv-q .lead{color:var(--ink2);font-size:15px;line-height:1.55;margin:0 0 26px;max-width:540px}
.sv-group{margin:0 0 24px}
.sv-group > .eyebrow{display:block;margin-bottom:9px}
.sv-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sv-opts.three{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.sv-opt{position:relative;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 38px 14px 14px;border:1.5px solid var(--rule2);border-radius:var(--r);background:var(--panel);
  transition:border-color .14s,transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .14s,background .14s}
.sv-opt:hover{border-color:var(--ink3);transform:translateY(-2px);box-shadow:var(--shadow)}
.sv-opt.on{border-color:var(--ultra);background:var(--ultraSoft);box-shadow:0 0 0 3px color-mix(in srgb,var(--ultra) 18%,transparent)}
.sv-opt .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel3);color:var(--ink2);flex:none;transition:background .14s,color .14s}
.sv-opt .ico svg{width:19px;height:19px;stroke-width:1.9}
.sv-opt.on .ico{background:var(--ultra);color:#fff}
.sv-opt .tx{min-width:0}
.sv-opt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.sv-opt .s{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
.sv-opt.on .s{color:var(--ink2)}
.sv-opt .tick{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule2);display:grid;place-items:center;color:transparent;transition:all .14s}
.sv-opt .tick svg{width:12px;height:12px;stroke-width:3}
.sv-opt.on .tick{background:var(--ultra);border-color:var(--ultra);color:#fff}
.sv-sample{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.03em;color:inherit}
.sv-rh{display:flex;gap:3px;width:120px;height:7px;margin-top:9px}
.sv-rh i{display:block;border-radius:4px;background:var(--ultra)}
.sv-rh i.off{background:var(--moss);opacity:.55}
.sv-name{max-width:360px;margin-bottom:24px}
.sv-name input{font-size:17px;padding:11px 13px}
.sv-points{display:grid;gap:10px;max-width:520px}
.sv-point{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--rule)}
.sv-point .ico{width:32px;height:32px;border-radius:10px;background:var(--ultraSoft);color:var(--ultra);display:grid;place-items:center;flex:none}
.sv-point .ico svg{width:17px;height:17px}
.sv-point b{display:block;font-size:14px}
.sv-point span{font-size:12.5px;color:var(--ink3)}
.sv-count{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);margin:14px 0 0}
.sv-addrow{gap:8px;max-width:520px;margin-bottom:12px}
.sv-addrow input{font-size:15px}
.sv-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.sv-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--rule2);border-left:4px solid var(--tc);font-size:13px;font-weight:600;animation:pop .2s cubic-bezier(.2,.9,.3,1) both}
.sv-chip button{width:20px;height:20px;border-radius:50%;color:var(--ink3);font-size:11px;display:grid;place-items:center}
.sv-chip button:hover{background:var(--crimsonSoft);color:var(--crimson)}
.sv-chip.ghost{opacity:.7;padding-right:10px;animation:none}
.sv-sug{padding:5px 11px;border-radius:20px;border:1px dashed var(--rule2);color:var(--ink2);font-size:12.5px;transition:all .12s}
.sv-sug:hover{border-style:solid;border-color:var(--ultra);color:var(--ultra);background:var(--ultraSoft)}
.sv-tog{margin:10px 0 0;font-size:14px}
.sv-themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.sv-sum{display:grid;gap:2px;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);overflow:hidden;max-width:560px}
.sv-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rule);font-size:13.5px}
.sv-row:last-child{border-bottom:none}
.sv-row .chip{margin:2px 3px 2px 0}
.sv-foot{display:flex;align-items:center;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--panel)}
.sv-foot .hint{font-size:12.5px;color:var(--ink3)}
.sv-foot .btn{padding:9px 16px;font-size:14px}
.sv-prev{border-left:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 50%,var(--bg));padding:28px 30px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.sv-donepv{display:none;margin-top:22px}
/* the live preview — the desk you are building, drawn from the real theme tokens */
.pv{width:100%;max-width:440px;margin:0 auto}
.pv-win{display:grid;grid-template-columns:124px minmax(0,1fr);height:318px;border-radius:14px;overflow:hidden;border:1px solid var(--rule2);box-shadow:var(--shadowUp);background:var(--bg);font-size:10px;line-height:1.3}
.pv-side{background:var(--panel);border-right:1px solid var(--rule);padding:10px 7px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.pv-brand{display:flex;align-items:center;gap:6px;margin:0 0 9px 3px}
.pv-brand i{width:16px;height:16px;border-radius:5px;background:var(--ultra);color:#fff;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:9.5px}
.pv-brand b{font-family:var(--display);font-size:11.5px;letter-spacing:-.02em}
.pv-n{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;color:var(--ink2);white-space:nowrap;overflow:hidden;animation:pvIn .3s both}
.pv-n svg{width:11px;height:11px;flex:none;stroke-width:2}
.pv-n.on{background:var(--ultraSoft);color:var(--ultra);font-weight:600}
.pv-eye{font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--ink3);margin:9px 0 3px 5px;text-transform:uppercase}
.pv-t{padding:3px 6px 3px 7px;margin-left:-7px;border-left:3px solid var(--tc);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pvIn .3s both}
.pv-main{padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.pv-hi small{display:block;font-family:var(--mono);font-size:7px;letter-spacing:.13em;color:var(--ink3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-hi b{display:block;font-family:var(--display);font-size:16px;letter-spacing:-.035em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px;animation:pvUp .35s both}
.pv-line{display:block;height:5px;border-radius:3px;background:var(--panel3)}
.pv-rib{position:relative;height:26px;border-radius:6px;background:var(--panel2)}
.pv-rib i{position:absolute;top:5px;height:16px;border-radius:4px}
.pv-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--rule)}
.pv-row:last-child{border-bottom:none}
.pv-row .cb{width:8px;height:8px;border-radius:2px;border:1.5px solid var(--ink3);flex:none}
.pv-row .pv-chip{width:26px;height:8px;border-radius:5px;background:var(--marigoldSoft);flex:none;margin-left:auto}
.pv-focus{display:flex;align-items:center;gap:10px}
.pv-focus b{font-family:var(--mono);font-size:22px;color:var(--ultra);letter-spacing:-.04em}
.pv-btn{display:inline-block;background:var(--ultra);color:#fff;border-radius:6px;padding:3px 8px;font-size:8.5px;font-weight:600}
.pv-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pv-tiles i{display:block;height:34px;border-radius:5px;background:var(--panel2);border-left:3px solid var(--tc)}
.pv-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pv-stat{background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:5px 6px;animation:pvUp .35s both}
.pv-stat b{display:block;font-family:var(--display);font-size:14px;letter-spacing:-.03em}
.pv-stat span{display:block;font-family:var(--mono);font-size:6px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-persona{display:inline-flex;align-items:center;gap:5px;background:var(--ultra);color:#fff;border-radius:20px;padding:3px 9px;font-size:9px;font-weight:600;align-self:flex-start;animation:pop .3s cubic-bezier(.2,.9,.3,1) both}
.pv-persona svg{width:10px;height:10px}
.pv-cap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-top:14px}
@keyframes pvIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes pvUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (max-width:980px){
  .sv-body{grid-template-columns:1fr}
  .sv-prev{display:none}
  .sv-donepv{display:block}
  .sv-q{padding:26px 18px 22px}
  .sv-qi{margin:0 auto}
}
@media (max-width:600px){
  .sv-top{padding:10px 14px;gap:10px}
  .sv-top .sv-brand{display:none}
  .sv-prog{margin-left:0}
  .sv-opts,.sv-opts.three{grid-template-columns:1fr}
  .sv-themes{grid-template-columns:repeat(2,1fr)}
  .sv-q h2{font-size:27px}
  .sv-q .lead{font-size:14px;margin-bottom:20px}
  .sv-row{grid-template-columns:86px 1fr}
  .pv-win{height:300px;grid-template-columns:108px minmax(0,1fr)}
}

/* ---------- one tidy HUD: glance line, menus, split add, settings, you ---------- */
.hello{margin-bottom:16px}
.glance{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;margin-top:9px;font-size:13px}
.g-term{color:var(--ink3);margin-right:3px}
.g-persona{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--ultraSoft);color:var(--ultra);font-weight:600;font-size:12.5px}
.g-persona svg{width:13px;height:13px}
.g-chip{padding:3px 10px;border-radius:20px;border:1px solid var(--rule2);color:var(--ink2);font-weight:500;font-size:12.5px;transition:border-color .12s,color .12s}
.g-chip:hover{border-color:var(--ink3);color:var(--ink)}
.g-chip.bad{border-color:color-mix(in srgb,var(--crimson) 45%,transparent);color:var(--crimson)}
.g-chip.good{border-color:color-mix(in srgb,var(--moss) 45%,transparent);color:var(--moss)}
.tlink{display:block;text-align:left;padding:0;color:inherit;font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tlink:hover{color:var(--ultra)}
.linkbtn{color:var(--ultra);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.empty .linkbtn{display:inline-block;margin-top:2px}
.pop{position:fixed;z-index:180;min-width:220px;max-width:300px;background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r2);box-shadow:var(--shadowUp);padding:5px;animation:pop .14s cubic-bezier(.2,.9,.3,1) both}
.pop hr{border:none;border-top:1px solid var(--rule);margin:5px 4px}
.popi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--ink)}
.popi svg{width:16px;height:16px;color:var(--ink3);flex:none;stroke-width:1.9}
.popi:hover,.popi:focus-visible{background:var(--panel3);outline:none}
.popi.dg,.popi.dg svg{color:var(--crimson)}
.addbtn{display:inline-flex}
.addbtn.split #quickAdd{border-top-right-radius:0;border-bottom-right-radius:0}
.addbtn #quickMore{border-top-left-radius:0;border-bottom-left-radius:0;padding:4px 6px;border-left:1px solid color-mix(in srgb,#fff 32%,transparent)}
.addbtn #quickMore svg{width:14px;height:14px}
.setwrap{max-width:1000px;display:grid;grid-template-columns:168px minmax(0,1fr);gap:28px;align-items:start}
.setnav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.setnav button{text-align:left;padding:7px 10px;border-radius:var(--r2);color:var(--ink2);font-weight:500}
.setnav button:hover{background:var(--panel3);color:var(--ink)}
.set{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px 8px;margin-bottom:16px;scroll-margin-top:12px}
.set > h2{font-size:18px;margin:0 0 4px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--rule)}
.set > h2 + .srow,.persona + .srow{border-top:none}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.srow .sl{flex:1;min-width:0}
.srow .sl b{display:block;font-size:14px;font-weight:600}
.srow .sl span{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.srow .sc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.srow .sc input[type=number]{width:84px}
.srow .sc input[type=time]{width:auto}
.srow .sc select{width:auto;max-width:280px}
.srow .sc input[type=text]{width:230px}
.srow details.adv{margin-top:0;border-top:none;padding-top:0}
.setfoot{text-align:center;font-size:12.5px;padding:6px 0 30px;margin:0}
.persona{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
.persona b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.035em}
.persona span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;max-width:520px}
.you-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.you-head b{display:block;font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.you-head .em{display:block;font-size:13px;color:var(--ink3)}
.ava{position:relative;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ava.big{width:46px;height:46px;border-radius:14px;font-size:19px}
.gnote{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--rule);margin-bottom:14px}
.gnote b{font-size:14.5px}.gnote > span{font-size:13px;color:var(--ink2)}
.gstate{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--rule);margin-bottom:14px}
.gstate .sdot{background:var(--moss);animation:none}
.gstate.paused .sdot{background:var(--marigold)}
.gstate.bad .sdot{background:var(--crimson)}
.gstate b{display:block;font-size:14px}.gstate span.t{display:block;font-size:12.5px;color:var(--ink3)}
.gbtn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 12px;border-radius:20px;background:#fff;border:1px solid #747775;color:#1f1f1f;font-family:Roboto,Arial,sans-serif;font-weight:500;font-size:14px;letter-spacing:.01em;transition:background .12s,box-shadow .12s;white-space:nowrap}
.gbtn:hover{background:#f8faff;box-shadow:0 1px 2px rgba(60,64,67,.3)}
.gbtn svg{width:18px;height:18px;flex:none}
.gbtn[disabled]{opacity:.6}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.fig{padding:10px 12px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--rule)}
.fig b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.03em;line-height:1.1}
.fig span{font-size:12px;color:var(--ink3)}
.heatwrap{padding:12px;border-radius:var(--r2);border:1px solid var(--rule)}
.bgrid.sm{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
.bgrid.sm .badge{padding:9px 10px}
.bgrid.sm .badge b{font-size:12px}
.bgrid.sm .bi{width:26px;height:26px;font-size:13px;margin-bottom:5px}
.aiopt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--rule2);border-radius:var(--r2);margin-bottom:9px;cursor:pointer}
.aiopt:has(input:checked){border-color:var(--ultra);background:var(--ultraSoft)}
.aiopt.off{opacity:.55;cursor:default}
.aiopt input[type=radio]{margin-top:3px;accent-color:var(--ultra)}
.aiopt > span{flex:1;min-width:0}
.aiopt b{display:block;font-size:14px}
.aiopt .t{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.toast.busy{display:flex;align-items:center;gap:9px}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.syncstate.paused::before{background:var(--marigold);animation:none}
.sv-google{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink2)}
@media (max-width:900px){
  .setwrap{grid-template-columns:1fr}
  .setnav{display:none}
  .set{padding:16px 16px 6px}
  .srow{flex-wrap:wrap;gap:10px}
  .srow .sc{justify-content:flex-start}
  .srow .sc input[type=text]{width:100%}
}
@media (max-width:600px){.srow .sl{flex:1 1 100%}.srow .sc input[type=number]{width:96px}}
@media (max-width:420px){.addbtn.split #quickAdd .lbl{display:none}}

/* ---------- the first screen: sign in with Google ---------- */
#gate{position:fixed;inset:0;z-index:95;background-color:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);overflow:hidden;color:var(--ink)}
#gate.out{animation:gateOut .28s ease both;pointer-events:none}
.gate-fine a{color:inherit;text-underline-offset:2px}
/* reCAPTCHA's floating badge sat on top of the phone tab bar; the required notice is in the AI sheet instead */
.grecaptcha-badge{visibility:hidden}
@keyframes gateOut{to{opacity:0;transform:scale(1.01)}}
.gate-main{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,7vw,100px);min-width:0;overflow-y:auto}
.gate-in{max-width:520px}
.gate-mark{display:flex;align-items:center;gap:12px;margin-bottom:44px}
.gate-mark .mark{width:40px;height:40px;border-radius:12px;font-size:21px}
.gate-mark b{font-family:var(--display);font-size:25px;letter-spacing:-.035em}
#gate h1{font-family:var(--display);font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.045em;margin:0 0 18px;font-weight:800}
.gate-lead{font-size:16.5px;line-height:1.55;color:var(--ink2);margin:0 0 32px;max-width:440px}
#gate .gbtn{height:50px;font-size:15.5px;padding:0 24px 0 16px;border-radius:25px;gap:12px;box-shadow:0 1px 2px rgba(60,64,67,.15)}
#gate .gbtn svg{width:20px;height:20px}
.gate-fine{font-size:12.5px;color:var(--ink3);margin:16px 0 0;max-width:420px;line-height:1.5}
.gate-note{margin:18px 0 0;padding:12px 14px;border-radius:var(--r2);background:var(--marigoldSoft);font-size:13px;line-height:1.5;max-width:440px}
.gate-note .linkbtn{display:inline-block;margin-top:6px}
.gate-skip{margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink3);max-width:440px}
.gate-skip button{color:var(--ink2);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.gate-skip button:hover{color:var(--ink)}
/* the art: a binder's divider tabs, one per subject, fanned out the way ATLAS files your classes */
.gate-art{position:relative;background:color-mix(in srgb,var(--panel) 55%,var(--bg));border-left:1px solid var(--rule);overflow:hidden}
.gtab{position:absolute;right:-12%;height:64px;display:flex;align-items:center;padding:0 22px;background:var(--panel);border:1px solid var(--rule);border-left:7px solid var(--tc);border-radius:12px 0 0 12px;box-shadow:var(--shadow);
  font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink2);animation:gtabIn .7s cubic-bezier(.2,.8,.25,1) both}
.gtab small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink3);letter-spacing:0;margin-top:1px}
@keyframes gtabIn{from{transform:translateX(70%);opacity:0}to{transform:none;opacity:1}}
.gate-strip{display:none;gap:5px;margin-bottom:26px}
.gate-strip i{display:block;height:6px;flex:1;border-radius:3px;background:var(--tc)}
@media (max-width:820px){
  #gate{grid-template-columns:1fr}
  .gate-art{display:none}
  .gate-main{justify-content:flex-start;padding:max(40px,8vh) 24px 32px}
  .gate-mark{margin-bottom:34px}
  .gate-strip{display:flex}
}

<script>
/*==MAIN==*/
/* ============================================================
   ATLAS — a single-file school desk.
   Sections: 1 utils  2 state  3 storage  4 domain logic
             5 ui primitives  6 views  7 ai  8 boot
   ============================================================ */

/* ---------- the host's settings ----------------------------------------
   Whoever hosts this copy fills these in once; visitors never see or type
   any of them. None is a secret: a sign-in client ID, a Firebase web config
   and a reCAPTCHA site key are public by design, and each only works from
   the site address registered with Google.
   · googleClientId  "Sign in with Google" (Google Auth Platform → Clients)
   · firebase        the web app config from Firebase → Project settings;
                     it turns the AI study tools on for everyone, no key

                     other sites and bots from using this copy's free AI
   ---------------------------------------------------------------------- */
const ATLAS_CONFIG = {
  googleClientId: '1076045342061-ilr81mrj0gubi5ihr9mlqoeubcfctv63.apps.googleusercontent.com',
  firebase: {
    apiKey: 'AIzaSyCsqm6pcxGbyjQuvlU2cnZOS4bDKWWoX6c',
    authDomain: 'atlas-school-desk.firebaseapp.com',
    projectId: 'atlas-school-desk',
    storageBucket: 'atlas-school-desk.firebasestorage.app',

  },

/* ---------- 1. utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const PALETTE = ['#2739CF', '#D9910F', '#CE3B47', '#0C8F6A', '#7B44D6', '#118AA6', '#E0653F', '#5A6785', '#B0367F', '#4E7B2A'];

function ymd(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function parseYMD(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parseYMD(s); d.setDate(d.getDate() + n); return ymd(d); }
function dowOf(s) { return parseYMD(s).getDay(); }
function startOfWeek(s, weekStart) { const d = parseYMD(s); const diff = (d.getDay() - (weekStart || 0) + 7) % 7; d.setDate(d.getDate() - diff); return ymd(d); }
function daysBetween(a, b) { return Math.round((parseYMD(b) - parseYMD(a)) / 86400000); }
function fmtDate(s, long) {
  if (!s) return '';
  const d = parseYMD(s), t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  const base = DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate();
  return long && d.getFullYear() !== new Date().getFullYear() ? base + ', ' + d.getFullYear() : base;
}
function toMin(hhmm) { if (!hhmm) return 0; const [h, m] = hhmm.split(':').map(Number); return h * 60 + (m || 0); }
function toHHMM(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; const p = n => String(n).padStart(2, '0'); return p(Math.floor(min / 60)) + ':' + p(min % 60); }
function fmt12(hhmm) {
  const m = toMin(hhmm), h = Math.floor(m / 60), mm = m % 60;
  const ap = h < 12 ? 'am' : 'pm', hh = h % 12 === 0 ? 12 : h % 12;
  return hh + (mm ? ':' + String(mm).padStart(2, '0') : '') + ap;
}
function dur(mins) { const h = Math.floor(mins / 60), m = Math.round(mins % 60); return (h ? h + 'h' : '') + (m ? (h ? ' ' : '') + m + 'm' : (h ? '' : '0m')); }
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* markdown-ish renderer for AI output and notes */
function md(src) {
  let t = esc(src || '');
  const blocks = [];
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (m, l, c) => { blocks.push(c); return '\u0000B' + (blocks.length - 1) + '\u0000'; });
  t = t.replace(/^### (.*)$/gm, '<h4>$1</h4>')
    .replace(/^## (.*)$/gm, '<h4>$1</h4>')
    .replace(/^# (.*)$/gm, '<h4>$1</h4>')
    .replace(/^\s*[-*] (.*)$/gm, '\u0000L$1')
    .replace(/^\s*(\d+)\. (.*)$/gm, '\u0000O$2')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^\s*---\s*$/gm, '<hr class="rule">');
  const out = [];
  let ul = null;
  t.split('\n').forEach(line => {
    const isL = line.startsWith('\u0000L'), isO = line.startsWith('\u0000O');
    if (isL || isO) {
      const tag = isL ? 'ul' : 'ol';
      if (ul !== tag) { if (ul) out.push('</' + ul + '>'); out.push('<' + tag + '>'); ul = tag; }
      out.push('<li>' + line.slice(2) + '</li>');
    } else {
      if (ul) { out.push('</' + ul + '>'); ul = null; }
      if (line.trim() === '') out.push('');
      else if (/^<(h4|hr)/.test(line)) out.push(line);
      else out.push('<p>' + line + '</p>');
    }
  });
  if (ul) out.push('</' + ul + '>');
  return out.join('\n').replace(/\u0000B(\d+)\u0000/g, (m, i) => '<pre><code>' + blocks[+i] + '</code></pre>');
}

/* ---------- 2. state ---------- */
const DEFAULTS = () => ({
  v: 2,
  profile: { name: '', school: '', term: 'This term' },
  classes: [], notes: [], tasks: [], events: [], decks: [], sessions: [], chats: [],
  _del: {}, _devices: {}, _settingsAt: 0, session: null,
  badges: [], game: null,
  settings: {
    theme: 'paper', nightTheme: 'midnight', autoNight: false, accent: null, texture: null, font: null, density: 'normal', corners: null, art: true, ambience: 'off',
    weekStart: 0, dayStart: '08:00', dayEnd: '22:00',
    pomodoro: { focus: 25, short: 5, long: 15 }, chunk: 45, buffer: 1,
    gpaScale: 4, aiOn: true,
    /* set by the setup survey; null means "everything on, original wording" */
    setupDone: false, setupSeen: false, setupNudge: true, level: null, modules: null, home: null, grading: null, celebrate: true
  }
});
let S = DEFAULTS();
let V = { name: 'today', param: null, sub: null };
const T = { running: false, mode: 'focus', left: 25 * 60, tick: null, endAt: null, classId: null };

/* ---------- 3. account, always-save, background sync ---------- */
/* One profile is one saved desk. Everything is written to this browser first,
   then mirrored to your Google account if you sign in, so a desk follows you to
   any device you open ATLAS on. Writes are coalesced, retried with backoff, and
   force-flushed on every exit path the browser gives us. Reads are polled, so a second tab or a
   second device catches itself up without you doing anything. Every record
   carries an `updated` stamp and every deletion leaves a tombstone, so merging
   two devices never loses the newer edit and never resurrects deleted work. */
const NS = 'atlas.v3';
const IDX = NS + '.index';
const dbKey = pid => NS + '.db.' + pid;
const TAB = uid();
const COLLECTIONS = ['classes', 'notes', 'tasks', 'events', 'decks', 'sessions', 'chats'];
const UA = () => (typeof navigator !== 'undefined' && navigator.userAgent) || '';

function deviceLabel() {
  const ua = UA();
  const os = /iPhone|iPod/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android'
    : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'this device';
  const br = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome'
    : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
  return br + ' on ' + os;
}
function deviceId() {
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { }
  const s = UA() + '|' + (typeof screen !== 'undefined' ? screen.width + 'x' + screen.height : '') + '|' + tz;
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return 'd' + h.toString(36);
}
const DEV = { id: deviceId(), name: deviceLabel() };

const Sync = {
  profile: null, index: null, rev: 0, dirty: false, saving: false, pending: false,
  lastSaved: 0, lastPull: 0, fails: 0, status: 'idle', locked: false,
  soft: null, hard: null, poller: null, beat: null, retry: null
};

/* --- storage drivers ---------------------------------------------------
   IndexedDB   : large, durable, survives reloads and reboots
   locked-down : localStorage, then memory as a last resort
   Google Drive sync sits on top of whichever one the browser allows. The
   rest of the app only ever talks to Drv. ------------------------------ */
let MEM = {};
const MEMD = {
  name: 'memory', label: 'Memory only — nothing survives a reload', cross: false,
  async get(k) { return MEM[k] === undefined ? null : MEM[k]; },
  async set(k, v) { MEM[k] = v; },
  async del(k) { delete MEM[k]; },
  async keys(p) { return Object.keys(MEM).filter(k => k.indexOf(p) === 0); }
};
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('atlas', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('indexeddb unavailable'));
    r.onblocked = () => rej(new Error('indexeddb blocked'));
  });
}
function idbDo(mode, fn) {
  return idbOpen().then(db => new Promise((res, rej) => {
    let req;
    const tx = db.transaction('kv', mode);
    try { req = fn(tx.objectStore('kv')); } catch (e) { rej(e); return; }
    tx.oncomplete = () => { res(req ? req.result : undefined); db.close(); };
    tx.onerror = () => { rej(tx.error || new Error('write failed')); db.close(); };
    tx.onabort = () => { rej(tx.error || new Error('write aborted')); db.close(); };
  }));
}
const IDBD = {
  name: 'idb', label: 'Saved in this browser', cross: false,
  get: k => idbDo('readonly', st => st.get(k)).then(v => v === undefined ? null : v),
  set: (k, v) => idbDo('readwrite', st => st.put(v, k)),
  del: k => idbDo('readwrite', st => st.delete(k)),
  keys: p => idbDo('readonly', st => st.getAllKeys()).then(ks => (ks || []).map(String).filter(k => k.indexOf(p) === 0))
};
const LSD = {
  name: 'ls', label: 'Saved in this browser (basic storage)', cross: false,
  async get(k) { const v = window.localStorage.getItem(k); return v == null ? null : JSON.parse(v); },
  async set(k, v) { window.localStorage.setItem(k, JSON.stringify(v)); },
  async del(k) { window.localStorage.removeItem(k); },
  async keys(p) { const o = []; for (let i = 0; i < window.localStorage.length; i++) { const k = window.localStorage.key(i); if (k && k.indexOf(p) === 0) o.push(k); } return o; }
};
let Drv = MEMD;
async function chooseDriver() {
  if (typeof indexedDB !== 'undefined' && indexedDB) {
    try { await IDBD.set(NS + '.probe', 1); await IDBD.del(NS + '.probe'); Drv = IDBD; return Drv; } catch (e) { }
  }
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      window.localStorage.setItem(NS + '.probe', '1'); window.localStorage.removeItem(NS + '.probe');
      Drv = LSD; return Drv;
    }
  } catch (e) { }
  Drv = MEMD;
  return Drv;
}
const hasStore = () => Drv.name !== 'memory';
async function sget(k) { return Drv.get(k); }
async function sgetSafe(k) { try { return await Drv.get(k); } catch (e) { return null; } }
async function sset(k, v) { return Drv.set(k, v); }
async function listKeys(p) { return Drv.keys(p); }
async function readKey(k) {
  for (let i = 0; i < 3; i++) {
    try { return { ok: true, value: await Drv.get(k) }; }
    catch (e) { await new Promise(r => setTimeout(r, 120 * (i + 1))); }
  }
  return { ok: false, value: null };
}
/* A read that fails must never look like "this account is empty", or the next
   write erases real work. Existence comes from keys(), not from a failed get. */
async function readDB(pid) {
  const key = dbKey(pid), bak = key + '.bak';
  let keys;
  try { keys = await listKeys(NS); }
  catch (e) { return { ok: false, value: null }; }
  if (keys.indexOf(key) < 0) {
    if (keys.indexOf(bak) >= 0) {
      const b = await readKey(bak);
      if (b.ok && b.value) return { ok: true, value: b.value, recovered: true };
    }
    return { ok: true, value: null };            /* genuinely nothing saved yet */
  }
  const r = await readKey(key);
  if (r.ok) return { ok: true, value: r.value };
  const b = await readKey(bak);
  if (b.ok && b.value) return { ok: true, value: b.value, recovered: true };
  return { ok: false, value: null };
}

/* --- change tracking: stamps and tombstones, with no call-site bookkeeping --- */
let LAST = {};
function eachRecord(fn) {
  COLLECTIONS.forEach(k => (S[k] || []).forEach(r => {
    if (!r.id) r.id = uid();
    fn(r, k);
    if (k === 'decks') (r.cards || []).forEach(c => { if (!c.id) c.id = uid(); fn(c, 'cards'); });
  }));
}
function hashRec(r, kind) {
  return JSON.stringify(r, (k, v) => (k === 'updated' || (kind === 'decks' && k === 'cards')) ? undefined : v);
}
function primeHashes() {
  LAST = {};
  eachRecord((r, k) => { LAST[r.id] = hashRec(r, k); });
  LAST.__set = JSON.stringify([S.profile, S.settings, S.badges]);
}
function stampChanges() {
  const now = Date.now(), seen = {};
  let touched = false;
  eachRecord((r, k) => {
    const h = hashRec(r, k);
    seen[r.id] = 1;
    if (LAST[r.id] !== h) { r.updated = now; LAST[r.id] = h; touched = true; }
    else if (!r.updated) r.updated = now;
  });
  Object.keys(LAST).forEach(id => {
    if (id === '__set' || seen[id]) return;
    S._del[id] = now; delete LAST[id]; touched = true;
  });
  const sh = JSON.stringify([S.profile, S.settings, S.badges]);
  if (LAST.__set !== sh) { S._settingsAt = now; LAST.__set = sh; touched = true; }
  /* tombstones older than 60 days have done their job */
  const cutoff = now - 5184000000;
  Object.keys(S._del).forEach(id => { if (S._del[id] < cutoff) delete S._del[id]; });
  return touched;
}

/* --- merge: newest wins per record, tombstones beat stale records --- */
function mergeDB(mine, theirs) {
  const out = Object.assign({}, mine);
  const del = Object.assign({}, theirs._del || {});
  Object.keys(mine._del || {}).forEach(id => { del[id] = Math.max(del[id] || 0, mine._del[id]); });
  out._del = del;
  const alive = r => !(del[r.id] > (r.updated || 0));
  const pick = (a, b) => {
    const ua = a.updated || 0, ub = b.updated || 0;
    if (ua !== ub) return ua > ub ? a : b;
    const sa = JSON.stringify(a), sb = JSON.stringify(b);   /* same instant: agree on content, not on argument order */
    return sa >= sb ? a : b;
  };

  COLLECTIONS.forEach(k => {
    if (k === 'decks' || k === 'chats') return;
    const m = new Map();
    (theirs[k] || []).forEach(r => m.set(r.id, r));
    (mine[k] || []).forEach(r => { const t = m.get(r.id); m.set(r.id, t ? pick(r, t) : r); });
    out[k] = Array.from(m.values()).filter(alive);
  });

  const dm = new Map();
  (theirs.decks || []).forEach(d => dm.set(d.id, d));
  (mine.decks || []).forEach(d => {
    const t = dm.get(d.id);
    if (!t) { dm.set(d.id, d); return; }
    const base = Object.assign({}, pick(d, t));
    const cm = new Map();
    (t.cards || []).forEach(c => cm.set(c.id, c));
    (d.cards || []).forEach(c => { const o = cm.get(c.id); cm.set(c.id, o ? pick(c, o) : c); });
    base.cards = Array.from(cm.values()).filter(alive);
    dm.set(d.id, base);
  });
  out.decks = Array.from(dm.values()).filter(alive);

  const km = new Map();
  (theirs.chats || []).forEach(c => km.set(c.id, c));
  (mine.chats || []).forEach(c => {
    const t = km.get(c.id);
    if (!t) { km.set(c.id, c); return; }
    const base = Object.assign({}, pick(c, t));
    base.messages = (c.messages || []).length >= (t.messages || []).length ? c.messages : t.messages;
    km.set(c.id, base);
  });
  out.chats = Array.from(km.values()).filter(alive);

  out._devices = Object.assign({}, theirs._devices || {}, mine._devices || {});
  Object.keys(theirs._devices || {}).forEach(id => {
    const a = (mine._devices || {})[id], b = theirs._devices[id];
    if (!a || (b.at || 0) > (a.at || 0)) out._devices[id] = b;
  });
  if ((theirs._settingsAt || 0) > (mine._settingsAt || 0)) {
    out.profile = theirs.profile; out.settings = theirs.settings; out.badges = theirs.badges; out._settingsAt = theirs._settingsAt;
  }
  if (!out.session || (theirs.session && (theirs.session.at || 0) > (out.session.at || 0) && (theirs.session.at || 0) > Date.now() - 1000)) {
    out.session = out.session || theirs.session;
  }
  return out;
}

/* --- capture whatever is on screen right now, saved or not --- */
function isTyping() {
  const a = document.activeElement;
  return !!a && /INPUT|TEXTAREA/.test(a.tagName);
}
function captureLive() {
  try {
    const nb = $('#noteBody'), nt = $('#noteTitle');
    if (nb && nt) {
      const n = S.notes.find(x => x.id === (nb.dataset.id || V.sub));
      if (n) {
        n.title = nt.value; n.body = nb.value;
        const nc = $('#noteClass'); if (nc) n.classId = nc.value || null;
        n.updatedAtEdit = undefined;
      }
    }
    const ci = $('#chatIn');
    if (ci) { const c = S.chats.find(x => x.id === V.param); if (c) c.draft = ci.value || ''; }
    S.session = { view: V.name, param: V.param, sub: V.sub, at: Date.now(), scroll: $('#view') ? $('#view').scrollTop : 0 };
  } catch (e) { }
}

/* --- last-gasp journal -----------------------------------------------
   IndexedDB is asynchronous: a tab that is force-quit, swiped away or
   killed by the OS can lose a transaction that was still in flight.
   localStorage is synchronous, so on the way out we write the whole
   state there in one blocking call, then recover it on next launch. --- */
const JOURNAL = NS + '.journal';
function journalWrite() {
  try {
    if (!Sync.profile || Sync.locked || !window.localStorage) return false;
    captureLive();
    if (stampChanges()) Sync.dirty = true;
    window.localStorage.setItem(JOURNAL, JSON.stringify({ pid: Sync.profile.id, at: Date.now(), rev: Sync.rev, data: S }));
    return true;
  } catch (e) { return false; }          /* quota or blocked — the async write is still trying */

/* 4a. spaced repetition — SM-2 */

  c.interval = clamp(c.interval, 0, 365);

  c.seen = today();

}

/* 4b. class meeting expansion → concrete day events */

    if (m.day !== dw) return;

    if (cls.endDate && day > cls.endDate) return;

  });

}

  S.events.filter(e => e.date === day && !(skipAuto && e.auto)).forEach(e => out.push(e));

/* 4c. free-slot finder + auto study scheduler */

  let cur = s;

function planStudy(tasks, opts) {
  const o = Object.assign({ chunk: 45, buffer: 1, horizon: 21, gap: 15 }, opts || {});
  const proposed = [], virtualBusy = {};
  const pending = tasks.filter(t => !t.done && t.due && (t.est || 0) > 0)
    .sort((a, b) => (a.due === b.due ? (b.priority || 1) - (a.priority || 1) : a.due < b.due ? -1 : 1));
  for (const t of pending) {
    let remain = (t.est || 0) - doneMinutes(t);
    if (remain <= 5) continue;
    const last = addDays(t.due, -o.buffer);
    let cursor = addDays(t.due, -o.horizon);
    if (cursor < today()) cursor = today();
    const days = [];
    for (let d = cursor; d <= last; d = addDays(d, 1)) days.push(d);
    /* Late, or due so soon the buffer leaves no room: work starts now and runs
       forward. A block on a day that has already passed helps nobody. */
    const urgent = !days.length;
    if (urgent) {
      const end = t.due >= today() ? t.due : addDays(today(), 2);
      for (let d = today(); d <= end; d = addDays(d, 1)) days.push(d);
    } else {
      days.reverse();   /* otherwise work lands near the deadline, but not on it */
    }
    for (const day of days) {
      if (remain <= 5) break;
      /* The plan being replaced is not busy time — counting it would push every
         re-run further from the ideal slots it already had. */
      let slots = freeSlots(day, 25, true).map(x => x.slice());
      (virtualBusy[day] || []).forEach(([a, b]) => {
        slots = slots.flatMap(([s, e]) => {
          if (b <= s || a >= e) return [[s, e]];
          const parts = [];
          if (a - s >= 25) parts.push([s, a]);
          if (e - b >= 25) parts.push([b, e]);
          return parts;

      for (const [s, e] of slots) {
        if (remain <= 5) break;
        let cur = s;
        while (e - cur >= 25 && remain > 5) {
          const len = Math.min(o.chunk, remain, e - cur);
          if (len < 25) break;

            id: uid(), kind: 'block', classId: t.classId, taskId: t.id,
            title: t.title, date: day, start: toHHMM(cur), end: toHHMM(cur + len), auto: true

/* --- small menus, anchored to the button that opened them --- */
const POP = { el: null, anchor: null };
function popMenu(anchor, items) {
  closePop();
  const list = items.filter(Boolean);
  const el = document.createElement('div');
  el.className = 'pop'; el.setAttribute('role', 'menu');
  el.innerHTML = list.map(it => it === '-' ? '<hr>' :
    '<button class="popi' + (it.danger ? ' dg' : '') + '" role="menuitem" data-act="' + it.act + '"' +
    Object.keys(it.data || {}).map(k => ' data-' + k + '="' + esc(it.data[k]) + '"').join('') + '>' + (it.icon ? ic(it.icon) : '') + '<span>' + esc(it.label) + '</span></button>').join('');
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.left = left + 'px'; el.style.top = top + 'px';
  POP.el = el; POP.anchor = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  el.addEventListener('click', e => { if (e.target.closest('.popi')) setTimeout(closePop, 0); });
  el.addEventListener('keydown', e => {
    const items = $$('.popi', el), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
  });
  const first = $('.popi', el); if (first) first.focus();
}
function closePop() {
  if (!POP.el) return;
  POP.el.remove();
  if (POP.anchor) POP.anchor.setAttribute('aria-expanded', 'false');
  POP.el = null; POP.anchor = null;
}
function togglePop(anchor, items) { if (POP.anchor === anchor) return closePop(); popMenu(anchor, items); }
