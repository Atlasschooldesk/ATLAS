function todayRibbon(agenda, nm) {
  const ds = toMin(S.settings.dayStart), de = toMin(S.settings.dayEnd), span = Math.max(de - ds, 60);

  const hours = [];

  return '<div class="ribbon">' +
    hours.map(h => '<div class="hr" style="left:' + pos(h * 60) + '%">' + fmt12(toHHMM(h * 60)) + '</div>').join('') +
    agenda.map((e, i) => {
      const a = toMin(e.start), b = toMin(e.end), w = Math.max(pos(b) - pos(a), 2.5);
      const col = e.classId ? clsColor(e.classId) : (e.kind === 'block' ? 'var(--ultra)' : 'var(--ink2)');
      return '<div class="rb" style="left:' + pos(a) + '%;width:' + w + '%;background:' + col + ';animation-delay:' + (i * 45) + 'ms" title="' + esc(e.title) + '">' +
        esc(e.title) + '<small>' + fmt12(e.start) + '</small></div>';
    }).join('') +
    (nm >= ds && nm <= de ? '<div class="nowline" style="left:' + pos(nm) + '%"></div>' : '') +

    '</div>';

/* --- Calendar --- */
const HOURPX = 52;
function calAnchor() { return V.sub || today(); }
function viewCalendar() {
  const mode = V.param || 'month';
  const anchor = calAnchor();
  const d = parseYMD(anchor);
  const label = mode === 'month' ? MONTHS[d.getMonth()] + ' ' + d.getFullYear()
    : 'Week of ' + fmtDate(startOfWeek(anchor, S.settings.weekStart), true);
  const head = '<div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">' +
    '<button class="btn sm" data-act="calStep" data-n="-1">‹</button>' +
    '<button class="btn sm" data-act="calToday">Today</button>' +
    '<button class="btn sm" data-act="calStep" data-n="1">›</button>' +
    '<h2 style="font-size:19px;margin-left:6px">' + label + '</h2><span class="spacer"></span>' +
    '<div class="seg"><button class="' + (mode === 'month' ? 'on' : '') + '" data-act="calMode" data-m="month">Month</button>' +
    '<button class="' + (mode === 'week' ? 'on' : '') + '" data-act="calMode" data-m="week">Week</button></div>' +
    '<button class="btn sm" data-act="calMenu" aria-label="More calendar actions" aria-haspopup="menu">' + ic('dots') + '</button></div>';
  return '<div class="wrap wide">' + head + (mode === 'month' ? monthGrid(anchor) : weekGrid(anchor)) + '</div>';
}
function monthGrid(anchor) {
  const d = parseYMD(anchor), first = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = startOfWeek(ymd(first), S.settings.weekStart);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const day = addDays(start, i);
    const dd = parseYMD(day);
    const out = dd.getMonth() !== d.getMonth();
    const ag = dayAgenda(day);
    const tks = S.tasks.filter(t => t.due === day);
    const hidden = Math.max(0, ag.length - 3) + Math.max(0, tks.length - 2);
    cells.push('<div class="cd' + (out ? ' out' : '') + (day === today() ? ' today' : '') + '" data-act="dayClick" data-day="' + day + '">' +
      '<span class="dnum">' + dd.getDate() + '</span>' +
      ag.slice(0, 3).map(e => '<span class="ev" style="--tc:' + (e.classId ? clsColor(e.classId) : 'var(--ink3)') + '">' + fmt12(e.start) + ' ' + esc(e.title) + '</span>').join('') +
      tks.slice(0, 2).map(t => '<span class="ev ' + (!t.done && t.due < today() ? 'late' : 'task') + '">' + (t.done ? '✓ ' : '') + esc(t.title) + '</span>').join('') +
      (hidden ? '<span class="dim mono" style="font-size:10px">+' + hidden + ' more</span>' : '') +
      '</div>');
  }
  const hdr = [0, 1, 2, 3, 4, 5, 6].map(i => '<div class="cdh">' + DAYS[(i + S.settings.weekStart) % 7] + '</div>').join('');
  return '<div class="calgrid">' + hdr + cells.join('') + '</div>';
}
function weekGrid(anchor) {
  const start = startOfWeek(anchor, S.settings.weekStart);
  const ags = [];
  for (let i = 0; i < 7; i++) ags.push(dayAgenda(addDays(start, i)));
  /* The grid stretches to whatever is actually booked, so an early lab or a late
     review session is never drawn off the top or bottom of the week. */
  let ds = Math.floor(toMin(S.settings.dayStart) / 60) * 60, de = toMin(S.settings.dayEnd);
  ags.forEach(ag => ag.forEach(e => {
    const a = toMin(e.start), b = toMin(e.end);
    if (b > a) { ds = Math.min(ds, Math.floor(a / 60) * 60); de = Math.max(de, Math.min(1440, Math.ceil(b / 60) * 60)); }
  }));
  const rows = Math.max(1, Math.ceil((de - ds) / 60));
  const gut = ['<div></div>'];
  const heads = [], cols = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(start, i), dd = parseYMD(day);
    heads.push('<div class="wh' + (day === today() ? ' now' : '') + '">' + DAYS[dd.getDay()] + '<b>' + dd.getDate() + '</b></div>');
    const ag = ags[i];
    const tks = S.tasks.filter(t => t.due === day && !t.done);
    let inner = '';
    for (let r = 0; r < rows; r++) inner += '<div class="slot" style="height:' + HOURPX + 'px" data-act="slotClick" data-day="' + day + '" data-min="' + (ds + r * 60) + '"></div>';
    inner += ag.map(e => {
      const top = ((toMin(e.start) - ds) / 60) * HOURPX;
      const h = Math.max(((toMin(e.end) - toMin(e.start)) / 60) * HOURPX - 2, 17);
      const col = e.classId ? clsColor(e.classId) : (e.kind === 'block' ? 'var(--ultra)' : 'var(--ink2)');
      return '<div class="wev" style="top:' + top + 'px;height:' + h + 'px;background:' + col + '" data-act="evClick" data-id="' + e.id + '" data-kind="' + e.kind + '">' +
        esc(e.title) + '<small>' + fmt12(e.start) + '</small></div>';
    }).join('');
    inner += tks.map((t, k) => '<div class="wev" style="top:' + (2 + k * 20) + 'px;height:18px;background:var(--marigold);font-size:10px" data-act="editTask" data-id="' + t.id + '">Due: ' + esc(t.title) + '</div>').join('');
    if (day === today() && nowMin() >= ds && nowMin() <= de) inner += '<div class="nowline" style="top:' + (((nowMin() - ds) / 60) * HOURPX) + 'px;left:0;right:0;bottom:auto;height:2px;width:auto"></div>';
    cols.push('<div class="wcol" style="height:' + (rows * HOURPX) + 'px">' + inner + '</div>');
  }
  let gutter = '';
  for (let r = 0; r < rows; r++) gutter += '<div class="gut" style="height:' + HOURPX + 'px">' + fmt12(toHHMM(ds + r * 60)) + '</div>';
  return '<div style="overflow-x:auto"><div class="week" style="min-width:680px">' + gut[0] + heads.join('') +
    '<div>' + gutter + '</div>' + cols.join('') + '</div></div>';
}

function viewTasks() {

  const totalMin = list.filter(t => !t.done).reduce((a, t) => a + (t.est || 0), 0);

/* Settings save as you change them — leaving the page without pressing a
   button used to throw the edit away. Fields hidden by your setup are skipped. */
function readSettingsForm() {
  const v = id => { const el = $('#' + id); return el ? el.value : null; };
  if (v('setName') != null) S.profile.name = v('setName').trim();
  if (v('setTerm') != null) S.profile.term = v('setTerm').trim();
  if (v('setStart') != null) S.settings.dayStart = v('setStart') || '08:00';
  if (v('setEnd') != null) S.settings.dayEnd = v('setEnd') || '22:00';
  if (toMin(S.settings.dayEnd) <= toMin(S.settings.dayStart)) S.settings.dayEnd = toHHMM(Math.min(toMin(S.settings.dayStart) + 60, 1439));
  if (v('setChunk') != null) S.settings.chunk = clamp(+v('setChunk') || 45, 25, 120);
  if (v('setBuf') != null) S.settings.buffer = clamp(+v('setBuf') || 0, 0, 7);
  if (v('setWeek') != null) S.settings.weekStart = +v('setWeek');
  if (v('setFocus') != null) S.settings.pomodoro.focus = clamp(+v('setFocus') || 25, 5, 120);
  if (v('setShort') != null) S.settings.pomodoro.short = clamp(+v('setShort') || 5, 1, 30);
  if (v('setAmb') != null) S.settings.ambience = v('setAmb');
  if (!T.running) { T.left = (T.mode === 'focus' ? S.settings.pomodoro.focus : S.settings.pomodoro.short) * 60; paintTimer(); }
}
function mountSettings() {
  $$('#view input, #view select').forEach(el => {
    if (el.dataset.act) return;
    el.addEventListener('change', () => { readSettingsForm(); save(); renderNav(); toast('Saved'); });
  });
}

/* --- a year of focus, at a glance --- */
function heatmap(bare) {
  const end = startOfWeek(today(), 0), weeks = 27;
  const start = addDays(end, -7 * (weeks - 1));
  const mins = {};

  const max = Math.max(60, ...Object.values(mins));
  let cells = '', months = '', lastM = -1;
  for (let w = 0; w < weeks; w++) {
    const wd = addDays(start, w * 7), m = parseYMD(wd).getMonth();
    months += '<span style="grid-column:' + (w + 1) + '">' + (m !== lastM && parseYMD(wd).getDate() <= 7 ? MONTHS[m].slice(0, 3) : '') + '</span>';
    if (m !== lastM && parseYMD(wd).getDate() <= 7) lastM = m;
    for (let d = 0; d < 7; d++) {
      const day = addDays(wd, w === weeks - 1 ? d : d), date = addDays(start, w * 7 + d);
      if (date > today()) { cells += '<i style="opacity:.15"></i>'; continue; }
      const v = mins[date] || 0, lvl = v === 0 ? 0 : Math.min(4, Math.ceil(v / (max / 4)));
      cells += '<i class="l' + lvl + '" title="' + fmtDate(date, true) + ' — ' + (v ? dur(v) : 'nothing') + '" data-act="heatDay" data-day="' + date + '"></i>';
    }
  }
  const total = S.sessions.reduce((a, s) => a + s.minutes, 0);
  const grid = '<div class="heat"><div class="heatm">' + months + '</div><div class="heatg">' + cells + '</div></div>' +
    '<div class="row dim" style="margin-top:10px;font-size:11.5px"><span>Focus over the last six months</span><span class="spacer"></span>' +
    '<span>less</span><span class="heatkey"><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span><span>more</span></div>';
  if (bare) return '<div class="heatwrap">' + grid + '</div>';
  return '<div class="card"><div class="cardhead">' + ic('timer', 'width:15px;height:15px') + '<h3>Focus history</h3><span class="spacer"></span>' +
    '<span class="chip">' + dur(total) + ' all time</span></div><div class="pad">' + grid + '</div></div>';
}
function bestStreak() {
  const days = Array.from(new Set(S.sessions.map(s => s.date))).sort();
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = (prev && addDays(prev, 1) === d) ? run + 1 : 1; prev = d; if (run > best) best = run; });
  return best;
}

/* --- ambience: generated, so there are no audio files to host --- */
const AMB = { ctx: null, nodes: [], kind: 'off', gain: null };
const AMBIENCE = { off: 'Off', brown: 'Deep noise', rain: 'Rain', waves: 'Waves', hum: 'Room tone' };
function ambienceStart(kind) {
  ambienceStop();
  if (!kind || kind === 'off') { AMB.kind = 'off'; S.settings.ambience = 'off'; save(); return; }
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AMB.ctx = new Ctx();
    const ctx = AMB.ctx, len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      d[i] = last * 3.2;
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    AMB.gain = gain;
    if (kind === 'rain') { filt.type = 'highpass'; filt.frequency.value = 900; gain.gain.value = .12; }
    else if (kind === 'waves') { filt.type = 'lowpass'; filt.frequency.value = 520; gain.gain.value = .18; }
    else if (kind === 'hum') { filt.type = 'lowpass'; filt.frequency.value = 220; gain.gain.value = .22; }
    else { filt.type = 'lowpass'; filt.frequency.value = 700; gain.gain.value = .16; }
    src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    if (kind === 'waves') {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 0.08; lg.gain.value = .1;
      lfo.connect(lg); lg.connect(gain.gain); lfo.start();
      AMB.nodes.push(lfo);
    }
    src.start();
    AMB.nodes.push(src);
    AMB.kind = kind;
    S.settings.ambience = kind; save();
  } catch (e) { toast('This browser will not let ATLAS play sound.', true); }
}
function ambienceStop() {
  try { AMB.nodes.forEach(n => { try { n.stop(); } catch (e) { } }); if (AMB.ctx) AMB.ctx.close(); } catch (e) { }
  AMB.nodes = []; AMB.ctx = null; AMB.gain = null; AMB.kind = 'off';
}

/* ============================================================
   Break. Two games chosen for one situation: you are in a
   lecture, half-listening, and you need somewhere to put your
   hands. Both are turn-based, neither has a clock, neither
   makes a sound, and walking away mid-move costs nothing.
   ============================================================ */

/* --- Tiles: slide and merge. Pure logic, so it can be tested. --- */
function tilesNew() {
  const b = new Array(16).fill(0);
  tilesSpawn(b); tilesSpawn(b);
  return { b: b, score: 0, over: false, won: false, prev: null };
}
function tilesSpawn(b) {
  const free = [];
  for (let i = 0; i < 16; i++) if (!b[i]) free.push(i);
  if (!free.length) return false;
  b[free[Math.floor(Math.random() * free.length)]] = Math.random() < 0.9 ? 2 : 4;
  return true;
}
function tilesLine(line) {
  const v = line.filter(Boolean), out = [];
  let gained = 0;
  for (let i = 0; i < v.length; i++) {
    if (v[i] === v[i + 1]) { out.push(v[i] * 2); gained += v[i] * 2; i++; }
    else out.push(v[i]);
  }
  while (out.length < 4) out.push(0);
  return { line: out, gained: gained };
}
function tilesIdx(r, dir) {
  const out = [];
  for (let c = 0; c < 4; c++) {
    if (dir === 0) out.push(r * 4 + c);
    else if (dir === 2) out.push(r * 4 + (3 - c));
    else if (dir === 1) out.push(c * 4 + r);
    else out.push((3 - c) * 4 + r);
  }
  return out;
}
function tilesShift(board, dir) {
  const b = board.slice();
  let gained = 0, moved = false;
  for (let r = 0; r < 4; r++) {
    const idx = tilesIdx(r, dir);
    const res = tilesLine(idx.map(i => b[i]));
    gained += res.gained;
    idx.forEach((i, k) => { if (b[i] !== res.line[k]) moved = true; b[i] = res.line[k]; });
  }
  return { b: b, gained: gained, moved: moved };
}
function tilesStuck(b) {
  for (let d = 0; d < 4; d++) if (tilesShift(b, d).moved) return false;
  return true;
}
function tilesMove(state, dir) {
  const r = tilesShift(state.b, dir);
  if (!r.moved) return state;
  const next = {
    b: r.b, score: state.score + r.gained, over: false,
    won: state.won || r.b.some(v => v >= 2048),
    prev: { b: state.b.slice(), score: state.score }
  };
  tilesSpawn(next.b);
  next.over = tilesStuck(next.b);
  return next;
}

/* --- Match: your own flashcards, face down. --- */
function matchNew(deckId, pairs) {
  const deck = S.decks.find(d => d.id === deckId);
  let src = [];
  if (deck && deck.cards.length >= 2) {
    src = shuffle(deck.cards.slice()).slice(0, clamp(pairs || 6, 3, 10))
      .map(c => ({ key: c.id, a: c.front, b: c.back }));
  } else {
    src = ['◆ ◇', '● ○', '▲ △', '■ □', '★ ☆', '⬢ ⬡'].slice(0, clamp(pairs || 6, 3, 10))
      .map((s, i) => ({ key: 'sym' + i, a: s.split(' ')[0], b: s.split(' ')[1] }));
  }
  const cards = [];
  src.forEach(p => {
    cards.push({ id: p.key + ':a', key: p.key, text: p.a, side: 'a' });
    cards.push({ id: p.key + ':b', key: p.key, text: p.b, side: 'b' });
  });
  return { deckId: deckId || null, cards: shuffle(cards), up: [], done: [], moves: 0 };
}
function matchFlip(state, id) {
  const s = Object.assign({}, state, { up: state.up.slice(), done: state.done.slice() });
  if (s.done.indexOf(id) >= 0 || s.up.indexOf(id) >= 0) return s;
  if (s.up.length >= 2) s.up = [];
  s.up.push(id);
  if (s.up.length === 2) {
    s.moves++;
    const a = s.cards.find(c => c.id === s.up[0]), b = s.cards.find(c => c.id === s.up[1]);
    if (a && b && a.key === b.key) { s.done = s.done.concat(s.up); s.up = []; s.justMatched = true; }
    else s.justMatched = false;
  }
  s.complete = s.done.length === s.cards.length;
  return s;
}

/* --- view --- */
function gameState() {

const TILE_STEP = { 2: 8, 4: 16, 8: 26, 16: 36, 32: 46, 64: 56, 128: 66, 256: 74, 512: 82, 1024: 90, 2048: 100 };

function matchView(g) {

function mountBreak() {
  const sel = $('#matchDeck');
  if (sel) sel.addEventListener('change', () => { gameState().match = matchNew(sel.value || null, 6); save(); render(); });
  const board = $('#tboard');
  if (!board) return;
  let sx = 0, sy = 0;
  board.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  board.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    doTiles(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
  }, { passive: true });
}
function doTiles(dir) {
  const g = gameState();
  if (!g.tiles || g.tiles.over) return;
  const next = tilesMove(g.tiles, dir);
  if (next === g.tiles) return;
  g.tiles = next;
  if (next.score > (g.best || 0)) g.best = next.score;
  save();
  if (V.name === 'break') render();
}

/* ============================================================

   · Otherwise Gemini through this copy's Firebase project. The
     Gemini key lives inside Google and never in this file; App
     Check lets only this site, in a real browser, use it.
   · Advanced: your own Gemini key, kept in this browser only.
   No conversation — every call is one shot in, one result out.
   ============================================================ */
const AI = { chrome: 'unknown', fb: null, fbLoading: null, cloudModel: null };
const AI_LANG = [{ type: 'text', languages: ['en'] }];

const CLOUD_MODELS = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-flash-latest'];
async function aiProbe() {
  try {
    if (typeof LanguageModel === 'undefined' || !LanguageModel.availability) { AI.chrome = 'unavailable'; return AI.chrome; }
    try { AI.chrome = await LanguageModel.availability({ expectedInputs: AI_LANG, expectedOutputs: AI_LANG }); }
    catch (e) { AI.chrome = await LanguageModel.availability(); }
  } catch (e) { AI.chrome = 'unavailable'; }

}
function chromeAI() { return AI.chrome === 'available' || AI.chrome === 'downloadable' || AI.chrome === 'downloading'; }

function cloudAI() { return !!(ATLAS_CONFIG.firebase && ATLAS_CONFIG.firebase.apiKey && ATLAS_CONFIG.firebase.appId); }
function aiMode() {

  if (p === 'chrome') return chromeAI() ? 'chrome' : 'off';
  /* automatic: on-device when it is already downloaded, then your own key, then ATLAS's free AI */
  if (chromeReady()) return 'chrome';

}

function aiLabel() {
  const m = aiMode();
  return m === 'gemini' ? 'Gemini, with your own key' : m === 'chrome' ? (Local.aiProvider === 'chrome' ? 'on this computer only' : 'free, nothing to set up') : m === 'cloud' ? 'free, nothing to set up' : 'off';
}
async function askAI(messages, system, maxTokens, json) {
  const mode = aiMode();
  if (mode === 'off') throw new Error('AI is off. Turn it on in Settings, under AI study tools.');
  const text = messages.map(m => m.content).join('\n\n');
  if (mode === 'gemini') return askGemini(text, system, json);
  if (mode === 'cloud') return askCloud(text, system, json);
  /* On-device. Its structured answers are less dependable, so when the choice is
     automatic, cards, quizzes and plans go to the cloud model, and a failed
     on-device answer falls back to it. "This computer only" never leaves it. */
  const auto = (Local.aiProvider || 'auto') === 'auto' && cloudAI();

function fbLoad() {

    .then(([appMod, checkMod, aiMod]) => {
      const app = appMod.initializeApp(ATLAS_CONFIG.firebase, 'atlas');
      if (ATLAS_CONFIG.recaptchaKey) checkMod.initializeAppCheck(app, { provider: new checkMod.ReCaptchaEnterpriseProvider(ATLAS_CONFIG.recaptchaKey), isTokenAutoRefreshEnabled: true });

    })
    .catch(() => { AI.fbLoading = null; throw new Error('Could not reach Google\'s AI. Check your connection or an ad blocker, then try again.'); });

}
async function askCloud(text, system, json) {
  const fb = await fbLoad();
  const models = [AI.cloudModel].concat(CLOUD_MODELS).filter((m, i, a) => m && a.indexOf(m) === i);
  let busy = false;
  for (const name of models) {
    let out;
    try {
      const model = fb.mod.getGenerativeModel(fb.ai, { model: name, systemInstruction: system, generationConfig: json ? { responseMimeType: 'application/json' } : {} });
      const r = await model.generateContent(text);
      out = String((r && r.response && r.response.text()) || '').trim();
    } catch (e) {
      const m = String((e && e.message) || e);
      if (/\b404\b|not.?found|not supported/i.test(m)) continue;                     /* a retired model: try the next */
      if (/\b429\b|quota|exhausted|rate.?limit/i.test(m)) { busy = true; continue; }   /* each model has its own allowance */
      if (/app.?check|attestation|recaptcha|\b40[13]\b/i.test(m)) throw new Error('ATLAS could not confirm this is a real browser on its own site, so Google blocked the request. Reload the page and try again.');
      if (/safety|blocked|prohibited/i.test(m)) throw new Error('Google declined to answer that one. Try rewording it.');
      if (/fetch|network|offline/i.test(m) && !/\b\d{3}\b/.test(m)) throw new Error('Could not reach Google\'s AI. Check your connection.');
      throw new Error('The AI request did not go through. Try again in a moment.');
    }
    if (!out) throw new Error('The model returned nothing. Try rephrasing.');

    return out;

}
async function askChrome(text, system) {
  if (typeof LanguageModel === 'undefined') throw new Error('This browser does not have Chrome\'s built-in AI.');
  let session;
  const sys = [{ role: 'system', content: system }];
  try { session = await LanguageModel.create({ initialPrompts: sys, expectedInputs: AI_LANG, expectedOutputs: AI_LANG }); }
  catch (e) {
    try { session = await LanguageModel.create({ initialPrompts: sys }); }
    catch (e2) { throw new Error(AI.chrome === 'available' ? 'Chrome\'s built-in AI could not start. Try again in a moment.' : 'Chrome is still getting its AI model ready. Try again in a few minutes.'); }

async function askGemini(text, system, json) {

    let j = null; try { j = await res.json(); } catch (e) { }
    const msg = (j && j.error && j.error.message) || '';
    if (res.ok) {

      const out = cand && cand.content ? (cand.content.parts || []).map(p => p.text || '').join('').trim() : '';
      if (out) { if (Local.model !== model) { Local.model = model; saveLocal(); } return out; }

/* ============================================================
   Google account. Sign in once and your desk follows you to every
   device: it is mirrored to a private ATLAS folder in your own
   Google Drive that only ATLAS can see. Free, no server, no secret.
   ATLAS asks only for permissions Google rates non-sensitive, so no
   one ever sees an "unverified app" warning. The token lives in
   memory for an hour and is renewed on your next tap.

function gClientId() { return String(Local.gClientId || ATLAS_CONFIG.googleClientId || '').trim(); }

function gSignedIn() { return !!G.token && Date.now() < G.exp; }
function gKnown() { return !!(Local.gWas && Local.gUser && Local.gUser.email); }
function gLinked() { return !!(Sync.index && Sync.profile && Sync.index.gProfile === Sync.profile.id); }

  G.loading = new Promise((res, rej) => {

async function gFindByName(name) {

async function gRead() {
  if (!G.fileId) { const f = await gFindByName(GFILE); if (f) G.fileId = f.id; }
  let id = G.fileId;
  if (!id && Sync.profile) { const old = await gFindByName('atlas-' + Sync.profile.id + '.json'); if (old) id = old.id; }
  if (!id) return null;
  const r = await gFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');

    const remote = await gRead();
    if (remote && remote.data) {
      captureLive();
      if (stampChanges()) Sync.dirty = true;
      /* A desk set up on another device beats a brand-new one here, even if this one was touched more recently. */
      if (!S.settings.setupDone && remote.data.settings && remote.data.settings.setupDone) S._settingsAt = 0;
      const before = JSON.stringify(S);
      S = mergeDB(S, remote.data);
      S.settings = Object.assign(DEFAULTS().settings, S.settings || {});
      primeHashes();
      changed = JSON.stringify(S) !== before;
      if (changed) { Sync.dirty = true; applyTheme(); if (!isTyping() && !$('.modal') && !SVY.open) render(); }
    }

    await gWrite(payloadNow());

    G.err = e.message;

    toast('Trying to fetch…');

      const r = await fetch(u.replace(/^webcal:/, 'https:'));
      if (!r.ok) throw new Error(r.status);

      if (!/BEGIN:VCALENDAR/i.test(t)) throw new Error('not a calendar');
      $('#impText').value = t;
      S.settings.feedUrl = u; save();
      toast('Fetched — press Import');

  /* AI enhancements — one shot each, no conversation */
  aiSetup: () => aiSetupSheet(),
  aiNote: (el) => {
    const n = S.notes.find(x => x.id === V.sub); if (!n) return;
    const body = $('#noteBody') ? $('#noteBody').value.trim() : (n.body || '').trim();
    if (body.length < 40) return toast('Write a bit more first — there is nothing to work from yet.', true);
    const mode = el.dataset.mode;
    aiRun(el, 'Working…', async () => {
      if (mode === 'cards') {
        const arr = await askJSON('Make 8-14 flashcards from these notes for the class "' + clsName(n.classId) +
          '". Each: {"front":"question or term","back":"answer, one or two sentences"}. Test understanding, not trivia.\n\nNotes:\n\n' + body,
          'You write flashcards for a student.', 2600);
        const cards = arr.filter(c => c.front && c.back).map(c => newCard(c.front, c.back));
        if (!cards.length) throw new Error('No usable cards came back. Try again.');
        const deck = { id: uid(), classId: n.classId, name: (n.title || 'Notes') + ' — cards', cards, created: Date.now() };
        S.decks.push(deck); save(true);
        toast('Made ' + cards.length + ' cards');
        go('cards', deck.id);
      } else if (mode === 'quiz') {
        const arr = await askJSON('Write 6 multiple-choice questions from these notes. Each: {"q":"...","choices":["a","b","c","d"],"answer":0,"why":"one sentence"}.\n\nNotes:\n\n' + body,
          'You write practice quizzes for a student.', 2600);
        const clean = arr.filter(q => q && q.q && Array.isArray(q.choices) && q.choices.length >= 2);
        if (!clean.length) throw new Error('No usable questions came back. Try again.');
        quizModal(clean);
      } else {
        const prompts = {
          summary: 'Summarise these notes in under 150 words, then list the 3 things most likely to show up on a test.',
          explain: 'Re-explain these notes simply, as if to someone seeing the topic for the first time. Use one everyday analogy.',
          outline: 'Rewrite these notes as a clean hierarchical outline. Keep every fact, fix the structure, mark anything that looks incomplete with (?).'
        };
        const out = await askAI([{ role: 'user', content: prompts[mode] + '\n\nNotes:\n\n' + body }], assistSystem(n.classId), 1500);
        aiResultSheet({ summary: 'Summary', explain: 'In plain language', outline: 'Cleaned-up outline' }[mode], out, () => {
          const b = $('#noteBody'); if (!b) return;
          b.value = b.value + '\n\n---\n\n' + out;
          b.dispatchEvent(new Event('input'));
          save(true); toast('Added to the page');
        });
      }
    });
  },

  restore: () => pickFile(txt => {
    try {
      const p = JSON.parse(txt);
      if (!p || !Array.isArray(p.classes)) throw new Error('bad file');
      confirmAsk('Replace everything?', 'This overwrites what is in ATLAS right now with the backup.', () => {
        const keepDel = Object.assign({}, S._del);
        S = Object.assign(DEFAULTS(), p); S.settings = Object.assign(DEFAULTS().settings, p.settings || {});
        /* keep the deletions this desk already knows about, or a second device
           could hand back something you removed long ago */
        S._del = Object.assign(keepDel, p._del || {});
        save(true); applyTheme(); go('today'); toast('Restored');
      });
    } catch (e) { toast('That file is not an ATLAS backup.', true); }
  }),

    S = DEFAULTS(); applyTheme(); save(true); go('today'); toast('Cleared');
    setTimeout(() => openSurvey({ first: true }), 260);   /* a blank desk gets built again, not left blank */

  matchFlip: el => {
    const g = gameState();

    g.match = matchFlip(g.match, el.dataset.id);
    if (g.match.complete && (g.matchBest == null || g.match.moves < g.matchBest)) g.matchBest = g.match.moves;
    save(); render();
    if (g.match.complete) celebrate();
    if (g.match.up.length === 2 && !g.match.justMatched) setTimeout(() => { if (gameState().match.up.length === 2) { gameState().match.up = []; if (V.name === 'break') render(); } }, 750);

function monthStep(anchor, n) { const d = parseYMD(anchor); d.setDate(1); d.setMonth(d.getMonth() + n); return ymd(d); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function parseCardList(text) {
  return String(text).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.split('\t').length > 1 ? l.split('\t') : l.split(/\s+[-–—]\s+|\s*::\s*|\s*:\s(?=\S)/);
    return m.length >= 2 ? { front: m[0].trim(), back: m.slice(1).join(' ').trim() } : null;
  }).filter(Boolean);
}

function quizModal(items) {

    if (i >= items.length) {
      $('.mbody').innerHTML = '<div class="empty"><div style="font-family:var(--display);font-size:46px;letter-spacing:-.04em">' + Math.round(score / items.length * 100) + '%</div><h3>' + score + ' of ' + items.length + '</h3><p>Missed ones are worth turning into flashcards.</p></div>';

      '<p style="font-size:16px;font-weight:600;margin:0 0 12px">' + esc(q.q) + '</p>' +

      '<div id="qFb"></div>';

  draw();
  onModal(e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const q = items[i], k = +b.dataset.pick, ok = k === q.answer;
    if (ok) score++;
    $$('[data-pick]').forEach(x => {
      const kk = +x.dataset.pick;

/* ---------- focus timer ---------- */
function paintTimer() {
  const m = Math.floor(T.left / 60), s = T.left % 60;
  const txt = m + ':' + String(s).padStart(2, '0');
  const el = $('#focusTime'); if (el) el.textContent = txt;
  const z = $('#zenTime'); if (z) z.textContent = txt;
  const ht = $('#heroTime'); if (ht) ht.textContent = txt;
  const bar = $('#focusBar'); if (bar) { bar.classList.toggle('run', T.running); bar.classList.toggle('brk', T.mode !== 'focus'); bar.title = T.mode === 'focus' ? 'Focus timer' : 'Break timer'; }
  const tog = $('#focusToggle'); if (tog) tog.innerHTML = ic(T.running ? 'pause' : 'go') + '<span class="lbl">' + (T.running ? 'Pause' : 'Start') + '</span>';
  const ring = $('#zenRing');
  if (ring) {
    const total = (T.mode === 'focus' ? S.settings.pomodoro.focus : S.settings.pomodoro.short) * 60;
    const c = 2 * Math.PI * 120;
    ring.style.strokeDasharray = c; ring.style.strokeDashoffset = c * (1 - (total - T.left) / total);
  }

}
function toggleTimer() {
  T.running = !T.running;
  if (T.running) {
    T.startedAt = Date.now();
    T.endAt = Date.now() + T.left * 1000;
    if (T.mode === 'focus' && S.settings.ambience && S.settings.ambience !== 'off' && AMB.kind === 'off') ambienceStart(S.settings.ambience);
    T.tick = setInterval(() => {
      T.left = Math.max(0, Math.round((T.endAt - Date.now()) / 1000));
      if (T.left <= 0) { finishSession(); return; }
      paintTimer();
    }, 1000);
  } else {
    clearInterval(T.tick);
    if (T.endAt) T.left = Math.max(0, Math.round((T.endAt - Date.now()) / 1000));
    T.endAt = null;
    logPartial();
  }
  paintTimer();
}
function logPartial() {
  if (!T.startedAt) return;
  const mins = Math.round((Date.now() - T.startedAt) / 60000);
  T.startedAt = null;
  if (mins >= 1 && T.mode === 'focus') { S.sessions.push({ id: uid(), date: today(), minutes: mins, classId: T.classId, taskId: T.taskId || null }); save(); }
}
function finishSession() {
  clearInterval(T.tick); T.running = false; T.endAt = null;
  ambienceStop();
  logPartial();
  checkBadges();
  const wasFocus = T.mode === 'focus';
  T.mode = wasFocus ? 'break' : 'focus';
  T.left = (T.mode === 'focus' ? S.settings.pomodoro.focus : S.settings.pomodoro.short) * 60;
  paintTimer();
  beep();
  toast(wasFocus ? 'Session logged — take ' + S.settings.pomodoro.short + ' minutes' : 'Break over — back to it');
  if ($('#zenTime')) { const l = $('#zenLabel'); if (l) l.textContent = T.mode === 'focus' ? 'Focus' : 'Break'; }
  if (V.name === 'today') render();
}
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 660; o.type = 'sine';
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, a.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 1.1);
    o.start(); o.stop(a.currentTime + 1.15);
  } catch (e) { }
}

    '<div class="pv-eye">Tools</div>' + tools.map((n, i) => nav(n, i + main.length)).join('') + '</div>' +

    (home ? heroes[home] : '') +
    (stats.length ? '<div class="pv-stats">' + stats.slice(0, 3).map(x => '<div class="pv-stat"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>').join('') + '</div>' : '') +
    '<div class="pv-card" style="flex:1;min-height:30px"><i class="pv-line" style="width:40%;margin-bottom:6px;background:var(--ink3)"></i><i class="pv-line" style="width:80%;margin-bottom:5px"></i><i class="pv-line" style="width:65%"></i></div>' +
    '</div></div><div class="pv-cap">' + (SVY.shown === 'done' ? 'Your desk' : 'Your desk, so far') + '</div></div>';
}
function svAddClass(name) {
  const a = SVY.a, n = String(name || '').trim().slice(0, 60);
  if (!n) return false;
  const lc = n.toLowerCase();
  if (a.classes.some(x => x.toLowerCase() === lc) || S.classes.some(c => c.name.toLowerCase() === lc)) { toast(n + ' is already on the list.'); return false; }
  if (a.classes.length >= 20) { toast('That is plenty for now — add more later.'); return false; }
  a.classes.push(n); a.sample = false;
  return true;
}
function svClick(e) {
  const t = e.target.closest('[data-sv-nav],[data-sv-pick],[data-sv-add],[data-sv-sug],[data-sv-rm],[data-sv-theme],[data-sv-tog],[data-sv-ws],[data-sv-den]');
  if (!t || !SVY.el) return;
  const a = SVY.a, d = t.dataset;
  if (d.svNav) return svNav(d.svNav);
  if (d.svPick) {
    const k = d.svPick, v = d.v;
    if (k === 'modules') a.modules[v] = !a.modules[v];
    else if (k === 'buffer') a.buffer = +v;
    else a[k] = v;
    /* sensible follow-ons, unless you already chose otherwise */
    if (k === 'level' && !a.gradingSet) a.grading = defaultGrading(v, a.tz);
    if (k === 'level' && !a.modulesSet) a.modules.grades = v !== 'self';
    if (k === 'grading') a.gradingSet = true;
    if (k === 'modules') a.modulesSet = true;
    return svPaint();
  }
  if (d.svTheme) { a.theme = d.svTheme; svLook(); return svPaint(); }
  if (d.svDen) { a.density = d.svDen; svLook(); return svPaint(); }
  if (d.svWs != null) { a.weekStart = +d.svWs; return svPaint(); }
  if (d.svTog) { a[d.svTog] = !a[d.svTog]; return svPaint(); }
  if (d.svRm != null) { a.classes.splice(+d.svRm, 1); return svPaint(); }
  if (d.svSug) { svAddClass(d.svSug); return svPaint(); }
  if (t.hasAttribute('data-sv-add')) {
    const inp = $('#svCls');
    if (inp && svAddClass(inp.value)) { svPaint(); const n = $('#svCls'); if (n) n.focus(); }
  }
}
function svInput(e) {
  if (e.target.id === 'svName') { SVY.a.name = e.target.value; $('#svP').innerHTML = svPreview(SVY.a); }
}
function svKey(e) {
  if (e.key !== 'Enter') return;

    e.preventDefault();

}
function svNav(dir) {
  const a = SVY.a, steps = svSteps(a), step = steps[SVY.step];
  if (dir === 'close') return closeModal();
  if (dir === 'back') { SVY.step = Math.max(SVY.first ? 0 : 1, SVY.step - 1); return svPaint(); }
  if (dir === 'next') {
    if (!svValid(step, a)) return;
    if (step === 'classes') { const inp = $('#svCls'); if (inp && inp.value.trim()) svAddClass(inp.value); }
    if (step === 'done') return svFinish();

function svFinish() {
  const a = SVY.a;

  applySurvey(a);
  SVY.open = false; SVY.el = null; modalCloser = null;
  $('#overlay').innerHTML = '';

}
function setupSettings() {

    (p ? '<b>' + esc(p.title) + '</b><span>' + esc(p.line) + '</span>'

      Object.keys(LEVELS).map(k => '<option value="' + k + '"' + ((LEVELS[s.level] ? s.level : 'high') === k ? ' selected' : '') + '>' + LEVELS[k].clsP + ' and ' + LEVELS[k].taskP.toLowerCase() + ' (' + LEVELS[k].name.toLowerCase() + ')</option>').join('') + '</select>') +
    (homes.length > 1 ? row('Today opens with', '', '<select data-act="setHome">' + homes.map(k => '<option value="' + k + '"' + (homeView() === k ? ' selected' : '') + '>' + esc(HOMES[k].name) + '</option>').join('') + '</select>') : '') +
    (on('grades') ? row('Grades read as', '', '<select data-act="setGrading">' + Object.keys(GRADINGS).map(k => '<option value="' + k + '"' + (grading() === k ? ' selected' : '') + '>' + GRADINGS[k].name + ' (' + GRADINGS[k].sample + ')</option>').join('') + '</select>') : '') +
    row('Celebrate wins', 'Badges, a streak and a little confetti.', '<input type="checkbox" data-act="setCelebrate"' + (s.celebrate !== false ? ' checked' : '') + ' aria-label="Celebrate wins">');
}

/* ============================================================
   The first screen. Whoever opens ATLAS — on a site, as an
   installed app, anywhere — is greeted by Google sign-in before
   anything else. Signed in once, a browser goes straight to the
   desk after that. "Use without an account" is the one way past
   it without Google, and the browser remembers that choice.
   ============================================================ */
const GATE = { open: false, note: '' };
const GATE_TABS = [['Biology', 'Lab report due Thursday'], ['Calculus', 'Problem set 6'], ['World History', 'Essay outline'], ['Spanish', '12 cards to review'], ['Chemistry', 'Midterm in 9 days'], ['Literature', 'Read ch. 12']];
function needGate() { return !gKnown() && !Local.gSkip; }
function openGate() {
  if (GATE.open) return paintGate();
  closeModal();
  GATE.open = true; GATE.note = '';
  const el = document.createElement('div');
  el.id = 'gate'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'gateTitle');
  el.innerHTML = '<div class="gate-main"></div><div class="gate-art" aria-hidden="true">' + GATE_TABS.map((t, i) => '<div class="gtab" style="--tc:' + PALETTE[i % PALETTE.length] + ';top:' + (13 + i * 12.5) + '%;width:' + (66 + (i % 3) * 8) + '%;animation-delay:' + (120 + i * 70) + 'ms">' +
    '<span>' + t[0] + '<small>' + t[1] + '</small></span></div>').join('') + '</div>';
  document.body.appendChild(el);
  el.addEventListener('click', gateClick);
  paintGate();
  if (gConfigured()) gLoadScript().catch(() => { });
  /* Everything behind is inert: it cannot be tapped or tabbed to, so the first Tab lands on Google's button. */
  ['#app', '#mobnav'].forEach(q => { const n = $(q); if (n) n.inert = true; });
}
function paintGate() {
  const el = $('#gate .gate-main'); if (!el) return;
  const busy = GATE.busy;
  el.innerHTML = '<div class="gate-in">' +
    '<div class="gate-strip" aria-hidden="true">' + PALETTE.slice(0, 6).map(c => '<i style="--tc:' + c + '"></i>').join('') + '</div>' +
    '<div class="gate-mark"><div class="mark">A</div><b>ATLAS</b></div>' +
    '<h1 id="gateTitle">Every class, deadline and note on one desk.</h1>' +
    '<p class="gate-lead">Sign in with your Google account and ATLAS keeps your desk in sync on your phone, your laptop and anywhere else you open it.</p>' +
    '<button class="gbtn" data-gate="google" data-gauth' + (busy ? ' disabled' : '') + '><svg viewBox="0 0 48 48" aria-hidden="true">' + GLOGO + '</svg><span>' + (busy ? 'Opening Google…' : 'Sign in with Google') + '</span></button>' +
    '<p class="gate-fine">Free. ATLAS keeps your desk in a private folder in your Google Drive that only ATLAS can see. It never opens your other files. <a href="privacy.html" target="_blank" rel="noopener">Privacy</a></p>' +
    (GATE.note ? '<div class="gate-note" role="alert">' + GATE.note + '</div>' : '') +
    '<div class="gate-skip">No Google account? <button data-gate="skip">Use ATLAS without one</button>. Your work stays in this browser.</div>' +
    '</div>';
}
function closeGate() {
  const el = $('#gate');
  GATE.open = false; GATE.busy = false;
  ['#app', '#mobnav'].forEach(q => { const n = $(q); if (n) n.inert = false; });
  if (!el) return;
  el.classList.add('out');
  setTimeout(() => el.remove(), 280);
}
/* What comes after the first screen: setup for a new desk, otherwise the desk itself. */
function afterGate() {
  render();
  const empty = !S.classes.length && !S.tasks.length && !S.notes.length;
  if (!S.settings.setupDone && !S.settings.setupSeen && empty) openSurvey({ first: true });
}
async function gateClick(e) {
  const b = e.target.closest('[data-gate]');
  if (!b) return;
  const what = b.dataset.gate;
  if (what === 'skip') { Local.gSkip = true; saveLocal(); closeGate(); afterGate(); return; }
  if (what === 'host') { ACT.gSetup(); return; }
  if (what !== 'google') return;
  if (!gConfigured()) {
    GATE.note = 'Google sign-in is not switched on for this copy of ATLAS yet. You can use it without an account for now; everything still saves in this browser.' +
      '<br><button class="linkbtn" data-gate="host">I host this copy and want to switch it on</button>';
    paintGate(); return;
  }
  GATE.busy = true; GATE.note = ''; paintGate();
  try {
    await gSignIn();                                  /* the pop-up opens inside this tap */
    Local.gSkip = false; saveLocal();
    closeGate();
    if (S.settings.setupDone) { render(); toast('Welcome back' + (S.profile.name ? ', ' + S.profile.name : (Local.gUser ? ', ' + Local.gUser.name : ''))); }
    else afterGate();
  } catch (err) {
    GATE.busy = false;
    GATE.note = esc(err.message) + (/pop-up|closed/i.test(err.message) ? '' : ' If Google is blocked where you are, you can use ATLAS without an account for now.');
    paintGate();
  }
}

/* ---------- seed ---------- */
function seedTerm() {
  const mk = (name, code, color, teacher, room, meets) => ({ id: uid(), name, code, color, teacher, room, credits: 1, meets, categories: [] });
  const c1 = mk('Biology', 'BIO-201', PALETTE[3], 'Ms. Ortiz', 'B-214', [{ day: 1, start: '09:00', end: '09:50' }, { day: 3, start: '09:00', end: '09:50' }, { day: 5, start: '13:00', end: '14:30' }]);
  const c2 = mk('US History', 'HIS-110', PALETTE[2], 'Mr. Doyle', 'A-102', [{ day: 2, start: '10:30', end: '11:45' }, { day: 4, start: '10:30', end: '11:45' }]);
  const c3 = mk('Calculus', 'MTH-140', PALETTE[0], 'Dr. Reyes', 'S-9', [{ day: 1, start: '11:00', end: '11:50' }, { day: 2, start: '11:00', end: '11:50' }, { day: 4, start: '11:00', end: '11:50' }]);
  const c4 = mk('Spanish III', 'SPN-301', PALETTE[1], 'Sra. Marín', 'L-3', [{ day: 3, start: '14:00', end: '15:15' }]);
  S.classes.push(c1, c2, c3, c4);
  c1.categories = [{ name: 'Labs', weight: 30, items: [{ name: 'Osmosis lab', earned: 27, total: 30 }] }, { name: 'Exams', weight: 50, items: [{ name: 'Unit 1', earned: 84, total: 100 }] }, { name: 'Homework', weight: 20, items: [{ name: 'Ch. 3', earned: 10, total: 10 }] }];
  c3.categories = [{ name: 'Quizzes', weight: 40, items: [{ name: 'Limits', earned: 17, total: 20 }] }, { name: 'Exams', weight: 60, items: [] }];
  const T2 = (title, classId, dd, est, notes) => S.tasks.push({ id: uid(), classId, title, due: addDays(today(), dd), dueTime: '', est, done: false, priority: 1, notes: notes || '' });
  T2('Lab report — enzyme activity', c1.id, 3, 150, 'Include the graph and error analysis.');
  T2('Read ch. 12 + discussion post', c2.id, 1, 60);
  T2('Problem set 6 (related rates)', c3.id, 2, 90);
  T2('Presentación oral — mi barrio', c4.id, 6, 120, '3 minutes, past tense required.');
  T2('Unit 2 exam — cell division', c1.id, 9, 240);
  S.notes.push({
    id: uid(), classId: c1.id, title: 'Mitosis vs meiosis', pinned: true, created: Date.now(), updated: Date.now(),
    body: '# Mitosis\n- One division, two identical diploid cells\n- Body cells, growth and repair\n- Phases: prophase, metaphase, anaphase, telophase\n\n# Meiosis\n- Two divisions, four haploid gametes\n- Crossing over in prophase I creates variation\n- Independent assortment in metaphase I\n\n**Test hint:** know *when* variation happens, not just that it does.'
  });
  const deck = { id: uid(), classId: c1.id, name: 'Cell division terms', created: Date.now(), cards: [] };
  [['Mitosis', 'One division producing two genetically identical diploid cells.'],
  ['Meiosis', 'Two divisions producing four genetically distinct haploid gametes.'],
  ['Crossing over', 'Exchange of segments between homologous chromosomes during prophase I.'],
  ['Independent assortment', 'Random orientation of homologous pairs at metaphase I, shuffling alleles.'],
  ['Diploid vs haploid', 'Diploid (2n) has both chromosome sets; haploid (n) has one.']]
    .forEach(p => deck.cards.push(newCard(p[0], p[1])));
  S.decks.push(deck);
  S.profile.term = 'Fall term';
}

/* ---------- 9. boot ---------- */
document.addEventListener('click', e => {
  if (POP.el && !e.target.closest('.pop') && !(POP.anchor && POP.anchor.contains(e.target))) closePop();
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  const c = e.target.closest('[data-class]');
  if (c && c.classList.contains('tab')) { go('class', c.dataset.class); return; }
  const a = e.target.closest('[data-act]');
  /* fields act on change, not on the click that focuses them */
  if (a && ACT[a.dataset.act] && a.tagName !== 'INPUT' && a.tagName !== 'SELECT') { ACT[a.dataset.act](a, e); }
}, true);
/* Leaving the score boxes is what redraws the grades — a box you edited back to
   its old value never fires "change", so that alone would leave a stale total. */
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.act === 'gradeIn') {
    clearTimeout(ACT._gt);
    ACT._gt = setTimeout(() => { if (V.name === 'grades' && !isTyping()) render(); }, 150);
  }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
}, false);
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const typing = !!ae && (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable);
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { if (POP.el) { closePop(); return; } closeModal(); return; }
  /* Cmd/Ctrl+C is copy, not "go to calendar"; Cmd+F is find, not the timer. */
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'f' && $('.zen')) { toggleTimer(); const z = $('#zenToggle'); if (z) z.textContent = T.running ? 'Pause' : 'Start'; return; }
  if ($('#overlay').innerHTML || GATE.open) return;   /* a sheet, the palette, focus mode or the sign-in screen is up */
  if (V.name === 'break' && gameState().mode === 'tiles') {
    const map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3, a: 0, w: 1, d: 2, s: 3 };
    if (map[e.key] !== undefined) { e.preventDefault(); doTiles(map[e.key]); return; }
  }
  if (V.name === 'review') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); R.flipped = true; render(); return; }
    if (R.flipped && ['1', '2', '3', '4'].includes(e.key)) { ACT.grade({ dataset: { q: [0, 2, 4, 5][+e.key - 1] } }); return; }
  }
  if (e.key === '/') { e.preventDefault(); openPalette(); }
  if (e.key === '?') { e.preventDefault(); keysSheet(); }
  if (e.key === 'n' && on('tasks')) taskModal();
  if (e.key === 't') go('today');
  if (e.key === 'c' && on('calendar')) go('calendar', 'week', today());
  if (e.key === 'f' && on('focus')) toggleTimer();
});

async function boot() {
  await chooseDriver();
  await requestPersistence();
  await loadLocal();
  await openAccount();
  if (S.settings.theme === 'day') S.settings.theme = 'paper';
  if (S.settings.theme === 'night') S.settings.theme = 'midnight';
  await journalRecover();
  applyTheme();
  checkBadges(true);
  T.left = S.settings.pomodoro.focus * 60;
  restoreSession();
  paintTimer();
  startSync();
  pull({ silent: true });
  $('#acctBtn').addEventListener('click', accountSheet);
  installManifest();
  if (Drv.name === 'memory') toast('This browser is blocking storage — nothing will be saved. Check private-browsing settings.', true);
  if (gConfigured()) {
    gLoadScript().catch(() => { });          /* loaded early, so a tap can open Google's window straight away */
    setInterval(() => { if (gSignedIn() && document.visibilityState === 'visible') gSync({ silent: true }); }, 180000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && gSignedIn()) gSync({ silent: true }); });
  }
  document.addEventListener('click', gRenewOnTap, true);
  renderNav(); setStatus(Sync.status);
  aiProbe().then(() => { if (!isTyping() && !$('#overlay').innerHTML) render(); });
  $('#view').addEventListener('scroll', closePop, { passive: true });
  window.addEventListener('resize', closePop);
  $('#menuBtn').addEventListener('click', () => {
    const s = $('#side'); s.classList.add('open');
    const sc = document.createElement('div'); sc.id = 'sideScrim';
    sc.addEventListener('click', () => { s.classList.remove('open'); sc.remove(); });
    document.body.appendChild(sc);
  });
  $('#searchBtn').addEventListener('click', openPalette);
  if (!/Mac|iPhone|iPad/.test(UA()) && $('#searchKb')) $('#searchKb').textContent = 'Ctrl K';
  $('#quickAdd').addEventListener('click', () => { const p = addPrimary(); if (p) { closePop(); p.run(); } else togglePop($('#addWrap'), addItems()); });
  $('#quickMore').addEventListener('click', () => togglePop($('#quickMore'), addItems()));
  $('#addClassBtn').addEventListener('click', () => classModal());
  $('#focusToggle').addEventListener('click', toggleTimer);
  $('#focusBar').addEventListener('click', e => { if (!e.target.closest('#focusToggle')) openZen(); });   /* the icon inside the button is not the button */
  setInterval(() => {
    if (SVY.open) return;                     /* never swap the theme out from under a preview */
    const busy = isTyping() || !!$('#overlay').innerHTML;
    if (S.settings.autoNight && document.documentElement.getAttribute('data-theme-id') !== activeThemeId()) { applyTheme(); if (!busy) render(); }
    else if (!busy && (V.name === 'today' || (V.name === 'calendar' && V.param === 'week'))) render();
  }, 60000);
  window.addEventListener('beforeunload', () => { if (T.running) logPartial(); flush(); });

  /* The first thing anyone sees is Google sign-in; setup for a new desk comes after it. */
  if (needGate()) openGate(); else afterGate();
}
if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('DOMContentLoaded', boot);
